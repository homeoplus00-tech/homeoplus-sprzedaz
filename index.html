<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#0f1113;
color:white;
}

/* LAYOUT */

.container{
display:flex;
height:100vh;
}

.left,.right{
width:50%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.right{
align-items:flex-start;
padding:60px;
}

/* MOBILE */

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:40%;}
.right{height:60%;width:100%;padding:20px;}
}

/* TYPO */

h1{
font-size:32px;
font-weight:800;
margin-bottom:10px;
}

.sub{
opacity:0.6;
margin-bottom:20px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
width:100%;
max-width:420px;
}

.option{
border:1px solid rgba(255,255,255,0.2);
padding:14px;
text-align:center;
cursor:pointer;
transition:0.2s;
border-radius:6px;
}

.option:hover{
border-color:#ebdaa8;
color:#ebdaa8;
}

/* SVG */

svg{
width:280px;
}

.layer *{
stroke:#ebdaa8;
stroke-width:2;
fill:none;
transition:0.3s;
}

/* STATES */

.problem *{
stroke:red !important;
stroke-dasharray:6;
}

.refresh *{
opacity:0.5;
}

/* CARD */

.card{
color:#ebdaa8;
margin-top:20px;
text-align:center;
font-weight:600;
}

</style>
</head>

<body>

<div class="container">

<div class="left">

<svg viewBox="0 0 400 400">
<g id="base"></g>
<g id="features"></g>
<g id="overlay"></g>
</svg>

<div class="card" id="summary"></div>

</div>

<div class="right" id="content"></div>

</div>

<script>

/* STATE */

let data={}, flow=[], step=0;

/* START */

start();

function start(){
set(`
<h1 style="color:#ebdaa8;">SPRZEDAŻ+</h1>
<div class="sub">Zajmujemy się sprzedażą Twojej nieruchomości od początku do końca.</div>

<div class="grid">
<div class="option" onclick="choose('mieszkanie')">Mieszkanie</div>
<div class="option" onclick="choose('dom')">Dom</div>
<div class="option" onclick="choose('lokal')">Lokal</div>
<div class="option" onclick="choose('hala')">Hala</div>
<div class="option" onclick="choose('dzialka')">Działka</div>
</div>
`);
}

/* FLOW */

function next(){
step++;
if(step<flow.length){flow[step]();}
else finish();
}

/* FLOWS */

const flows={

mieszkanie:[
city,location,size,rooms,floor,balcony,parking,standard,state
],

dom:[
city,location,size,plot,floors,garden,garage,standard,state
],

lokal:[
city,location,size,purpose,windowQ,traffic,standard,state
],

hala:[
city,location,size,height,gate,tir,standard,state
],

dzialka:[
city,location,size,typeQ,access,media,state
]

};

/* COMMON */

function city(){
set(`<h1>Lokalizacja</h1>
<input id="city" class="option" placeholder="Miasto">
<div class="option" onclick="saveCity()">Dalej</div>`);
}

function location(){
set(`<h1>Położenie</h1>
<div class="grid">
<div class="option" onclick="save('loc','centrum')">Centrum</div>
<div class="option" onclick="save('loc','poza')">Poza centrum</div>
</div>`);
}

function size(){
set(`<h1>Metraż</h1>
<div class="grid">
<div class="option" onclick="save('size','<40')">do 40</div>
<div class="option" onclick="save('size','40-60')">40–60</div>
<div class="option" onclick="save('size','60-100')">60–100</div>
<div class="option" onclick="save('size','100+')">100+</div>
</div>`);
}

/* MIESZKANIE */

function rooms(){
set(`<h1>Pokoje</h1>
<div class="grid">
${[1,2,3,4,'5+'].map(n=>`<div class="option" onclick="setRooms('${n}')">${n}</div>`).join("")}
</div>`);
}

function floor(){
set(`<h1>Piętro</h1>
<div class="grid">
<div class="option" onclick="move(0)">Parter</div>
<div class="option" onclick="move(-10)">Środek</div>
<div class="option" onclick="move(-20)">Wysokie</div>
</div>`);
}

function balcony(){feature("balcony");}
function parking(){simple("parking");}

/* DOM */

function plot(){simple("plot");}
function floors(){simple("floors");}
function garden(){feature("garden");}
function garage(){feature("garage");}

/* LOKAL */

function purpose(){simple("purpose");}
function windowQ(){feature("window");}
function traffic(){simple("traffic");}

/* HALA */

function height(){
set(`<h1>Wysokość</h1>
<div class="grid">
<div class="option" onclick="setHeight(80)">do 4m</div>
<div class="option" onclick="setHeight(140)">4m+</div>
</div>`);
}

function gate(){feature("gate");}
function tir(){simple("tir");}

/* DZIAŁKA */

function typeQ(){simple("type");}
function access(){feature("access");}
function media(){simple("media");}

/* COMMON */

function standard(){simple("standard");}

function state(){
set(`<h1>Stan</h1>
<div class="grid">
<div class="option" onclick="setState('ideal')">Gotowa</div>
<div class="option" onclick="setState('refresh')">Odświeżenie</div>
<div class="option" onclick="setState('problem')">Problemy</div>
</div>`);
}

/* ACTIONS */

function choose(t){
data={type:t};
flow=flows[t];
step=0;

drawBase(t);
flow[0]();
}

function saveCity(){
data.city=document.getElementById("city").value;
next();
}

function save(k,v){
data[k]=v;
next();
}

function simple(key){
save(key,true);
}

function feature(type){
let f=document.getElementById("features");

if(type==="balcony") f.innerHTML+=`<rect x="150" y="320" width="100" height="20"/>`;
if(type==="garden") f.innerHTML+=`<rect x="80" y="320" width="240" height="40"/>`;
if(type==="garage") f.innerHTML+=`<rect x="280" y="260" width="40" height="40"/>`;
if(type==="window") f.innerHTML+=`<rect x="150" y="200" width="100" height="40"/>`;
if(type==="gate") f.innerHTML+=`<rect x="180" y="260" width="40" height="40"/>`;
if(type==="access") f.innerHTML+=`<line x1="0" y1="300" x2="100" y2="260"/>`;

next();
}

function setRooms(n){
let overlay=document.getElementById("overlay");
overlay.innerHTML="";

let count=n==='5+'?5:n;

for(let i=1;i<count;i++){
let x=100+(i*(200/count));
overlay.innerHTML+=`<line x1="${x}" y1="120" x2="${x}" y2="320"/>`;
}
next();
}

function move(y){
document.querySelector("svg").style.transform=`translateY(${y}px)`;
next();
}

function setHeight(h){
document.querySelector("#base rect").setAttribute("height",h);
next();
}

function setState(s){
data.state=s;

if(s==="problem"){
document.querySelector("svg").classList.add("problem");
}else if(s==="refresh"){
document.querySelector("svg").classList.add("refresh");
}

next();
}

/* SVG */

function drawBase(type){

let base=document.getElementById("base");
base.innerHTML="";

if(type==="mieszkanie"){
base.innerHTML=`<rect x="100" y="120" width="200" height="200"/>`;
}

if(type==="dom"){
base.innerHTML=`<path d="M100 200 L200 120 L300 200 V300 H100 Z"/>`;
}

if(type==="lokal"){
base.innerHTML=`<rect x="120" y="180" width="160" height="120"/>`;
}

if(type==="hala"){
base.innerHTML=`<rect x="100" y="220" width="200" height="80"/>`;
}

if(type==="dzialka"){
base.innerHTML=`<rect x="100" y="220" width="200" height="80"/>`;
}

clear();
}

function clear(){
document.getElementById("features").innerHTML="";
document.getElementById("overlay").innerHTML="";
document.querySelector("svg").className="";
}

/* FINISH */

function finish(){

if(data.state==="problem"){
set(`<h1>OD ZERA+</h1><p>Zajmujemy się wszystkim od podstaw.</p>`);
}else{
set(`<h1>SPRZEDAŻ+</h1><p>Przechodzimy do kolejnego etapu.</p>`);
}

document.getElementById("summary").innerText=JSON.stringify(data,null,1);
}

/* UI */

function set(html){
document.getElementById("content").innerHTML=html;
}

</script>

</body>
</html>
