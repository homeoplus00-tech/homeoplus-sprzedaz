<section class="homeo">

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h2><b>HOMEO+</b> | <b>SPRZEDAŻ+</b></h2>
    <p>
      To symulacja działania systemu sprzedaży.<br><br>
      Każda nieruchomość analizowana jest indywidualnie.
    </p>
    <button onclick="acceptSim()">Rozumiem</button>
  </div>
</div>

<!-- START -->
<div class="screen start" id="start">
  <h1>SPRZEDAŻ<span>+</span></h1>
  <p>System sprzedaży nieruchomości</p>

  <input id="price" placeholder="Wartość (PLN)">
  <input id="size" placeholder="Metraż (m²)">
  <input id="city" placeholder="Miasto">

  <button onclick="openSim()">Uruchom</button>
</div>

<!-- SYSTEM -->
<div class="screen system hidden" id="system">

  <div class="top">
    <div>HOMEO+ SYSTEM</div>
    <div id="day">Dzień 1</div>
  </div>

  <!-- CENTRALNA OPERACJA -->
  <div class="focus">
    <div id="operation">Inicjalizacja systemu</div>
  </div>

  <!-- DANE W TLE -->
  <div class="bottom">

    <div class="price-box">
      <div id="priceView">0 PLN</div>
      <span>aktualna cena</span>
    </div>

    <div class="stats">
      <div><b id="views">0</b><span>wyświetlenia</span></div>
      <div><b id="buyers">0</b><span>zainteresowani</span></div>
      <div><b id="offers">0</b><span>oferty</span></div>
    </div>

    <div class="market" id="market"></div>

  </div>

</div>

</section>

<style>
.homeo{
  font-family:'Montserrat',sans-serif;
  background:#000;
  color:#fff;
}

/* MODAL */
.modal{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal.active{display:flex;}

.modal-box{
  background:#111;
  padding:40px;
  border:1px solid #222;
  text-align:center;
}

/* SCREENS */
.screen{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

/* START */
.start h1{
  font-size:80px;
  letter-spacing:2px;
}
.start span{color:#ebdaa8;}

.start p{
  color:#777;
  margin-bottom:20px;
}

input{
  margin:6px;
  padding:14px;
  width:260px;
  background:#111;
  border:1px solid #222;
  color:#fff;
}

button{
  margin-top:20px;
  padding:16px 40px;
  background:#ebdaa8;
  border:none;
  color:#000;
  font-weight:600;
}

/* SYSTEM */
.system{
  justify-content:space-between;
  padding:40px;
}

.top{
  width:100%;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#777;
}

/* FOCUS (KLUCZ PREMIUM) */
.focus{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

#operation{
  font-size:48px;
  max-width:900px;
  line-height:1.2;
  color:#ebdaa8;
  opacity:0;
  transform:translateY(20px);
  transition:all .8s ease;
}

#operation.show{
  opacity:1;
  transform:translateY(0);
}

/* BOTTOM */
.bottom{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}

/* PRICE */
.price-box{
  text-align:left;
}
.price-box div{
  font-size:40px;
  color:#ebdaa8;
}
.price-box span{
  font-size:12px;
  color:#666;
}

/* STATS */
.stats{
  display:flex;
  gap:40px;
}
.stats b{
  font-size:20px;
  color:#ebdaa8;
}
.stats span{
  display:block;
  font-size:11px;
  color:#777;
}

/* MARKET */
.market{
  font-size:12px;
  color:#777;
  text-align:right;
}

/* MOBILE */
@media(max-width:900px){

  #operation{
    font-size:28px;
  }

  .bottom{
    flex-direction:column;
    gap:20px;
    align-items:flex-start;
  }

}
.hidden{display:none;}
</style>

<script>
let base, price;
let views=0, buyers=0, offers=0;
let demand=1;
let day=1;

const ops = [
"Klient otrzymuje dostęp do aplikacji HOMEO+",
"Analizujemy rynek i dane transakcyjne",
"Ustalamy strategię ceny wejścia",
"Produkujemy materiały premium",
"Optymalizujemy nieruchomość (home staging)",
"Publikujemy ofertę i uruchamiamy dystrybucję",
"Rozpoczynamy kampanię marketingową",
"Precyzyjnie targetujemy kupujących",
"Selekcjonujemy realnych klientów",
"Prowadzimy negocjacje wielostronne",
"Finalizujemy transakcję"
];

function openSim(){
  document.getElementById("modal").classList.add("active");
}

function acceptSim(){
  document.getElementById("modal").classList.remove("active");
  start();
}

function start(){
  base = parseInt(document.getElementById("price").value)||500000;
  price = base;

  document.getElementById("start").classList.add("hidden");
  document.getElementById("system").classList.remove("hidden");

  run();
}

function showOperation(text){
  let el = document.getElementById("operation");
  el.classList.remove("show");

  setTimeout(()=>{
    el.innerText=text;
    el.classList.add("show");
  },300);
}

function updateMarket(){
  let comp = (Math.random()*1.5).toFixed(2);
  let time = Math.floor(20+Math.random()*40);

  document.getElementById("market").innerHTML = `
    popyt: ${demand.toFixed(2)}<br>
    konkurencja: ${comp}<br>
    śr. czas sprzedaży: ${time} dni
  `;
}

function run(){

  let i=0;

  let loop=setInterval(()=>{

    if(i < ops.length){
      showOperation(ops[i]);

      demand += 0.15;
      price *= 1.01;

      i++;
    }

    views += Math.floor(120 * demand);
    buyers += Math.floor(1 * demand);

    if(Math.random()>0.7){
      offers++;
      price += base * 0.004 * demand;
    }

    document.getElementById("views").innerText=views;
    document.getElementById("buyers").innerText=buyers;
    document.getElementById("offers").innerText=offers;
    document.getElementById("priceView").innerText=
      Math.floor(price).toLocaleString()+" PLN";

    updateMarket();

    day++;
    document.getElementById("day").innerText="Dzień "+day;

    if(i>=ops.length){
      clearInterval(loop);
    }

  },3000); // 🔥 wolniej = premium

}
</script>
