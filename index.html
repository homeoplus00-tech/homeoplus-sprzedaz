<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMEO+ SPRZEDAŻ+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Montserrat', sans-serif;
    background: #1B1C1E;
    color: white;
    overflow: hidden;
}

/* LAYOUT */

.container {
    display: flex;
    height: 100vh;
}

.left {
    width: 50%;
    background: #1B1C1E;
    display: flex;
    align-items: center;
    justify-content: center;
}

.right {
    width: 50%;
    background: white;
    color: black;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* TYPO */

h1 {
    font-size: 42px;
    font-weight: 800;
}

p {
    margin-top: 20px;
    opacity: 0.7;
}

/* BUTTONS */

.button {
    margin-top: 40px;
    padding: 18px 32px;
    background: #ebdaa8;
    color: black;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

.button:hover {
    background: black;
    color: #ebdaa8;
}

/* OPTIONS */

.option {
    margin-top: 20px;
    padding: 16px;
    border: 1px solid #ddd;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    border-color: black;
}

/* VISUAL */

.house {
    width: 200px;
    height: 200px;
    border: 2px solid #ebdaa8;
    position: relative;
    opacity: 0;
    transition: 1s;
}

.house.active {
    opacity: 1;
}

.size {
    position: absolute;
    bottom: -40px;
    color: #ebdaa8;
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT VISUAL -->
    <div class="left">
        <div class="house" id="house">
            <div class="size" id="size"></div>
        </div>
    </div>

    <!-- RIGHT FLOW -->
    <div class="right" id="content">

        <h1>SPRZEDAŻ+</h1>
        <p>Zaczynamy proces sprzedaży Twojej nieruchomości.</p>

        <button class="button" onclick="start()">Rozpocznij</button>

    </div>

</div>

<script>

let step = 0;
let data = {};

function start() {
    nextStep();
}

function nextStep() {
    step++;

    const content = document.getElementById("content");

    if (step === 1) {
        content.innerHTML = `
            <h1>Co sprzedajesz?</h1>
            <div class="option" onclick="selectType('mieszkanie')">Mieszkanie</div>
            <div class="option" onclick="selectType('dom')">Dom</div>
            <div class="option" onclick="selectType('dzialka')">Działka</div>
        `;
    }

    if (step === 2) {
        content.innerHTML = `
            <h1>Podaj metraż</h1>
            <input type="number" id="sizeInput" placeholder="np. 75" style="padding:15px; margin-top:20px;">
            <button class="button" onclick="saveSize()">Dalej</button>
        `;
    }
}

function selectType(type) {
    data.type = type;

    document.getElementById("house").classList.add("active");

    nextStep();
}

function saveSize() {
    const size = document.getElementById("sizeInput").value;

    if (!size) return alert("Podaj metraż");

    data.size = size;

    document.getElementById("size").innerText = size + " m²";

    nextStep();
}

</script>

</body>
</html>
