<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#0f1113;
color:white;
}

/* LAYOUT */

.container{
display:flex;
height:100vh;
}

.left{
width:50%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.right{
width:50%;
padding:80px;
display:flex;
flex-direction:column;
justify-content:center;
}

/* MOBILE */

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:45%;}
.right{height:55%;padding:25px;}
svg{width:200px;}
}

/* TYPO */

.hero{
font-size:40px;
font-weight:800;
color:#ebdaa8;
}

.sub{
opacity:0.6;
margin:20px 0 40px;
}

/* OPTIONS */

.option{
border:1px solid rgba(255,255,255,0.2);
padding:14px;
margin-top:10px;
cursor:pointer;
transition:0.2s;
}

.option:hover{
border-color:#ebdaa8;
color:#ebdaa8;
}

/* SVG */

svg{
width:300px;
margin-bottom:30px;
}

svg path, svg rect, svg line{
fill:none;
stroke:#ebdaa8;
stroke-width:2;
stroke-dasharray:400;
stroke-dashoffset:400;
transition:0.5s;
}

.draw path, .draw rect, .draw line{
stroke-dashoffset:0;
}

/* STATES */

.problem *{
stroke:red !important;
stroke-dasharray:6;
}

.refresh *{
opacity:0.4;
}

/* CARD */

.card{
color:#ebdaa8;
text-align:center;
}

.card strong{
display:block;
font-weight:800;
}

.card span{
opacity:0.7;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="left">

<svg id="svg" viewBox="0 0 400 400"></svg>

<div class="card">
<strong id="type"></strong>
<span id="details"></span>
</div>

</div>

<div class="right" id="content"></div>

</div>

<script>

/* ===== STATE ===== */

let data = {};
let flow = [];
let stepIndex = 0;

/* ===== START ===== */

start();

function start(){
set(`
<div class="hero">SPRZEDAŻ+</div>
<div class="sub">Prowadzimy cały proces sprzedaży nieruchomości.</div>

<div class="option" onclick="chooseType('mieszkanie')">Mieszkanie</div>
<div class="option" onclick="chooseType('dom')">Dom</div>
<div class="option" onclick="chooseType('lokal')">Lokal usługowy</div>
<div class="option" onclick="chooseType('hala')">Magazyn / hala</div>
<div class="option" onclick="chooseType('dzialka')">Działka</div>
`);
}

/* ===== FLOW ===== */

function next(){
stepIndex++;
if(stepIndex < flow.length){
flow[stepIndex]();
}else{
analyze();
}
}

/* ===== FLOWS ===== */

const flows = {

mieszkanie: [stepRooms, stepFloor, stepBalcony, stepState],
dom: [stepRooms, stepGarden, stepState],
lokal: [stepWindow, stepState],
hala: [stepHeight, stepGate, stepState],
dzialka: [stepAccess, stepState]

};

/* ===== STEPS ===== */

function stepRooms(){
set(`
<h1>Układ nieruchomości</h1>
${[1,2,3,4,5].map(n=>`<div class="option" onclick="setRooms(${n})">${n===5?"5+":n}</div>`).join("")}
`);
}

function stepFloor(){
set(`
<h1>Pozycja</h1>
<div class="option" onclick="setFloor(0)">Parter</div>
<div class="option" onclick="setFloor(1)">Środek</div>
<div class="option" onclick="setFloor(2)">Wysoko</div>
`);
}

function stepBalcony(){
set(`
<h1>Balkon</h1>
<div class="option" onclick="setBalcony(true)">Tak</div>
<div class="option" onclick="setBalcony(false)">Nie</div>
`);
}

function stepGarden(){
set(`
<h1>Ogród</h1>
<div class="option" onclick="setGarden(true)">Tak</div>
<div class="option" onclick="setGarden(false)">Nie</div>
`);
}

function stepWindow(){
set(`
<h1>Witryna</h1>
<div class="option" onclick="setWindow(true)">Duża</div>
<div class="option" onclick="setWindow(false)">Brak</div>
`);
}

function stepHeight(){
set(`
<h1>Wysokość hali</h1>
<div class="option" onclick="setHeight(1)">Niska</div>
<div class="option" onclick="setHeight(2)">Wysoka</div>
`);
}

function stepGate(){
set(`
<h1>Brama</h1>
<div class="option" onclick="setGate(true)">Tak</div>
<div class="option" onclick="setGate(false)">Nie</div>
`);
}

function stepAccess(){
set(`
<h1>Dojazd</h1>
<div class="option" onclick="setAccess(true)">Jest</div>
<div class="option" onclick="setAccess(false)">Brak</div>
`);
}

function stepState(){
set(`
<h1>Stan</h1>
<div class="option" onclick="setState('ideal')">Gotowa</div>
<div class="option" onclick="setState('refresh')">Odświeżenie</div>
<div class="option" onclick="setState('renovation')">Remont</div>
<div class="option" onclick="setState('problem')">Problemy</div>
`);
}

/* ===== SVG ===== */

function drawBase(type){

let svg = document.getElementById("svg");
svg.innerHTML="";
svg.className="";

/* BASE */

if(type==="mieszkanie") svg.innerHTML=`<rect x="100" y="120" width="200" height="200"/>`;
if(type==="dom") svg.innerHTML=`<path d="M100 200 L200 120 L300 200 V300 H100 Z"/>`;
if(type==="lokal") svg.innerHTML=`<rect x="120" y="180" width="160" height="120"/>`;
if(type==="hala") svg.innerHTML=`<rect id="hall" x="80" y="220" width="240" height="80"/>`;
if(type==="dzialka") svg.innerHTML=`<rect x="100" y="220" width="200" height="80"/>`;

animate();
}

/* ===== REAKCJE ===== */

function setRooms(n){
data.rooms=n;

let svg=document.getElementById("svg");
svg.querySelectorAll("line").forEach(e=>e.remove());

for(let i=1;i<n;i++){
let l=document.createElementNS("http://www.w3.org/2000/svg","line");
l.setAttribute("x1",100+(i*(200/n)));
l.setAttribute("y1",120);
l.setAttribute("x2",100+(i*(200/n)));
l.setAttribute("y2",320);
svg.appendChild(l);
}

updateDetails(n);
animate();
next();
}

function setFloor(level){
let svg=document.getElementById("svg");

svg.style.transform=`translateY(${-level*10}px)`;

animate();
next();
}

function setBalcony(v){
if(v){
let b=document.createElementNS("http://www.w3.org/2000/svg","rect");
b.setAttribute("x",150);
b.setAttribute("y",320);
b.setAttribute("width",100);
b.setAttribute("height",20);
document.getElementById("svg").appendChild(b);
}
animate();
next();
}

function setGarden(v){
if(v){
let g=document.createElementNS("http://www.w3.org/2000/svg","rect");
g.setAttribute("x",80);
g.setAttribute("y",320);
g.setAttribute("width",240);
g.setAttribute("height",40);
document.getElementById("svg").appendChild(g);
}
animate();
next();
}

function setWindow(v){
if(v){
let w=document.createElementNS("http://www.w3.org/2000/svg","rect");
w.setAttribute("x",150);
w.setAttribute("y",200);
w.setAttribute("width",100);
w.setAttribute("height",40);
document.getElementById("svg").appendChild(w);
}
animate();
next();
}

function setHeight(h){
let hall=document.getElementById("hall");
if(hall){
hall.setAttribute("height", h===2?140:80);
}
animate();
next();
}

function setGate(v){
if(v){
let g=document.createElementNS("http://www.w3.org/2000/svg","rect");
g.setAttribute("x",180);
g.setAttribute("y",260);
g.setAttribute("width",40);
g.setAttribute("height",40);
document.getElementById("svg").appendChild(g);
}
animate();
next();
}

function setAccess(v){
if(v){
let line=document.createElementNS("http://www.w3.org/2000/svg","line");
line.setAttribute("x1",0);
line.setAttribute("y1",300);
line.setAttribute("x2",100);
line.setAttribute("y2",260);
document.getElementById("svg").appendChild(line);
}
animate();
next();
}

function setState(s){
data.state=s;

let svg=document.getElementById("svg");
svg.className="";

if(s==="problem") svg.classList.add("problem");
if(s==="refresh") svg.classList.add("refresh");

next();
}

/* ===== TYPE ===== */

function chooseType(t){
data={};
data.type=t;

drawBase(t);

document.getElementById("type").innerText=t.toUpperCase();

flow = flows[t];
stepIndex = 0;

flow[0]();
}

/* ===== UI ===== */

function set(html){
document.getElementById("content").innerHTML=html;
}

function updateDetails(n){
document.getElementById("details").innerText =
n===1?"1 pokój":
n<=4?n+" pokoje":
n+" pokoi";
}

function animate(){
let svg=document.getElementById("svg");
svg.classList.remove("draw");
setTimeout(()=>svg.classList.add("draw"),50);
}

/* ===== ANALIZA ===== */

function analyze(){

if(data.state==="problem"||data.state==="renovation"){
set(`
<h1>OD ZERA+</h1>
<p>Zajmujemy się nieruchomością od podstaw — od kwestii prawnych po sprzedaż.</p>
<div class="option">Sprawdź system</div>
`);
}else{
set(`<h1>SPRZEDAŻ+</h1><p>Przechodzimy dalej.</p>`);
}

}

</script>

</body>
</html>
