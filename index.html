<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPRZEDAŻ+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

/* ================= DESIGN SYSTEM ================= */

:root {
    --color-bg-main: #FFFFFF;
    --color-bg-dark: #1B1C1E;
    --color-text-light: #6F6F6F;
    --color-accent: #ebdaa8;

    --space-lg: 40px;
    --space-xl: 80px;
}

/* ================= BASE ================= */

body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    background: var(--color-bg-dark);
}

/* ================= LAYOUT ================= */

.container {
    display: flex;
    height: 100vh;
}

.left {
    width: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.right {
    width: 50%;
    background: white;
    padding: var(--space-xl);
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* ================= MOBILE ================= */

@media (max-width: 900px) {
    .container {
        flex-direction: column;
    }

    .left {
        width: 100%;
        height: 40%;
    }

    .right {
        width: 100%;
        height: 60%;
        padding: var(--space-lg);
    }
}

/* ================= TYPO ================= */

h1 {
    font-size: 42px;
    font-weight: 800;
}

p {
    color: var(--color-text-light);
}

/* ================= UI ================= */

.button {
    margin-top: 30px;
    padding: 16px 28px;
    background: var(--color-accent);
    border: none;
    font-weight: 600;
    cursor: pointer;
}

.option {
    padding: 16px;
    border: 1px solid #ddd;
    margin-top: 15px;
    cursor: pointer;
}

.input {
    margin-top: 20px;
    padding: 14px;
    width: 100%;
    border: none;
    border-bottom: 1px solid #ccc;
}

/* ================= SVG ================= */

.visual {
    position: relative;
    width: 100%;
    max-width: 320px;
}

#propertySVG {
    width: 100%;
    opacity: 0;
    transition: opacity 0.4s ease;
}

/* LINIE */

#propertySVG path,
#propertySVG rect,
#propertySVG line {
    fill: none;
    stroke: var(--color-accent);
    stroke-width: 2;

    stroke-dasharray: 400;
    stroke-dashoffset: 400;

    transition: stroke-dashoffset 0.8s ease;
}

/* RYSOWANIE */

#propertySVG.active {
    opacity: 1;
}

#propertySVG.draw path,
#propertySVG.draw rect,
#propertySVG.draw line {
    stroke-dashoffset: 0;
}

/* INFO */

.property-info {
    position: absolute;
    bottom: -60px;
    left: 0;
    color: var(--color-accent);
    font-weight: 600;
}

#propertySize {
    margin-top: 5px;
}

</style>
</head>

<body>

<div class="container">

<!-- ================= LEWA ================= -->

<div class="left">

<div class="visual">

<svg id="propertySVG" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">

<!-- KSZTAŁT -->

<path id="shape1"></path>
<path id="shape2"></path>
<rect id="shape3"></rect>
<rect id="shape4"></rect>
<rect id="shape5"></rect>
<line id="shape6"></line>

</svg>

<div class="property-info">
<div id="propertyType"></div>
<div id="propertySize"></div>
</div>

</div>

</div>

<!-- ================= PRAWA ================= -->

<div class="right" id="content">

<h1>SPRZEDAŻ+</h1>
<p>Zaczynamy sprzedaż Twojej nieruchomości.</p>

<button class="button" onclick="start()">Rozpocznij</button>

</div>

</div>

<script>

/* ================= STATE ================= */

let step = 0;
let data = {};

/* ================= FLOW ================= */

function start() {
    nextStep();
}

function nextStep() {
    step++;

    const content = document.getElementById("content");

    if (step === 1) {
        content.innerHTML = `
            <h1>Co sprzedajesz?</h1>

            <div class="option" onclick="selectType('apartment')">Mieszkanie</div>
            <div class="option" onclick="selectType('house')">Dom</div>
            <div class="option" onclick="selectType('land')">Działka</div>
        `;
    }

    if (step === 2) {
        content.innerHTML = `
            <h1>Podaj metraż</h1>

            <input class="input" type="number" id="sizeInput" placeholder="np. 75">

            <button class="button" onclick="saveSize()">Dalej</button>
        `;
    }

    if (step === 3) {
        content.innerHTML = `
            <h1>Dzięki.</h1>
            <p>To dopiero początek procesu.</p>
        `;
    }
}

/* ================= SVG SHAPES ================= */

function setShape(type) {

    const s1 = document.getElementById("shape1");
    const s2 = document.getElementById("shape2");
    const s3 = document.getElementById("shape3");
    const s4 = document.getElementById("shape4");
    const s5 = document.getElementById("shape5");
    const s6 = document.getElementById("shape6");

    // reset
    s1.setAttribute("d", "");
    s2.setAttribute("d", "");
    s3.setAttribute("width", 0);
    s4.setAttribute("width", 0);
    s5.setAttribute("width", 0);
    s6.setAttribute("x1", 0);

    if (type === "house") {
        s1.setAttribute("d", "M100 200 L200 120 L300 200 V300 H100 Z");
        s2.setAttribute("d", "M100 200 L200 120 L300 200");

        s3.setAttribute("x", 180);
        s3.setAttribute("y", 240);
        s3.setAttribute("width", 40);
        s3.setAttribute("height", 60);

        s4.setAttribute("x", 130);
        s4.setAttribute("y", 220);
        s4.setAttribute("width", 30);
        s4.setAttribute("height", 30);

        s5.setAttribute("x", 240);
        s5.setAttribute("y", 220);
        s5.setAttribute("width", 30);
        s5.setAttribute("height", 30);
    }

    if (type === "apartment") {
        s1.setAttribute("d", "M130 120 H270 V300 H130 Z");

        s6.setAttribute("x1", 130);
        s6.setAttribute("y1", 180);
        s6.setAttribute("x2", 270);
        s6.setAttribute("y2", 180);
    }

    if (type === "land") {
        s1.setAttribute("d", "M100 150 H300 V270 H100 Z");
    }

    drawProperty();
}

/* ================= SVG ANIM ================= */

function drawProperty() {
    const svg = document.getElementById("propertySVG");

    svg.classList.remove("draw");

    svg.classList.add("active");

    setTimeout(() => {
        svg.classList.add("draw");
    }, 50);
}

/* ================= ACTIONS ================= */

function selectType(type) {

    data.type = type;

    setShape(type);

    let label = "";

    if (type === "house") label = "DOM+";
    if (type === "apartment") label = "MIESZKANIE+";
    if (type === "land") label = "DZIAŁKA+";

    document.getElementById("propertyType").innerText = label;

    nextStep();
}

function saveSize() {

    const size = document.getElementById("sizeInput").value;

    if (!size) {
        alert("Podaj metraż");
        return;
    }

    data.size = size;

    document.getElementById("propertySize").innerText = size + " m²";

    nextStep();
}

</script>

</body>
</html>
