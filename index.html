<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMEO+ DOM</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#0f1113;
color:white;
font-family:Montserrat;
overflow:hidden;
}

.container{
display:flex;
height:100vh;
}

.left,.right{
width:50%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.right{
align-items:flex-start;
padding:60px;
}

/* MOBILE */

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:40%;}
.right{height:60%;width:100%;padding:20px;}
}

/* UI */

h1{
font-size:32px;
font-weight:800;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
width:100%;
max-width:420px;
}

.option{
border:1px solid rgba(255,255,255,0.2);
padding:14px;
text-align:center;
cursor:pointer;
transition:0.25s;
}

.option:hover{
border-color:#ebdaa8;
color:#ebdaa8;
}

.input{
width:100%;
padding:14px;
background:transparent;
border:none;
border-bottom:1px solid rgba(255,255,255,0.3);
color:white;
margin-bottom:20px;
}

/* SVG */

svg{
width:280px;
transition:0.4s;
}

svg *{
stroke:#ebdaa8;
stroke-width:2;
fill:none;
transition:0.4s;
}

/* STATES */

.problem *{
stroke:red !important;
stroke-dasharray:6;
}

.refresh *{
opacity:0.5;
}

/* ANIM */

.fade{
animation:fade 0.4s ease;
}

@keyframes fade{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<div class="container">

<div class="left">
<svg id="svg" viewBox="0 0 400 400"></svg>
</div>

<div class="right" id="content"></div>

</div>

<script>

let data = {};

/* START */

start();

function start(){
drawBase();
stepCity();
}

/* ===== STEPS ===== */

function stepCity(){
set(`
<h1>Lokalizacja</h1>
<input id="city" class="input" placeholder="Miasto">
<div class="option" onclick="saveCity()">Dalej</div>
`);
}

function stepLocation(){
set(`
<h1>Położenie</h1>
<div class="grid">
<div class="option" onclick="next('location','centrum')">Centrum</div>
<div class="option" onclick="next('location','poza')">Poza centrum</div>
</div>
`);
}

function stepHouseSize(){
set(`
<h1>Metraż domu</h1>
<div class="grid">
<div class="option" onclick="next('houseSize','<100')">do 100 m²</div>
<div class="option" onclick="next('houseSize','100-200')">100–200</div>
<div class="option" onclick="next('houseSize','200+')">200+</div>
</div>
`);
}

function stepPlot(){
set(`
<h1>Metraż działki</h1>
<div class="grid">
<div class="option" onclick="next('plot','<500')">do 500 m²</div>
<div class="option" onclick="next('plot','500-1000')">500–1000</div>
<div class="option" onclick="next('plot','1000+')">1000+</div>
</div>
`);
}

function stepFloors(){
set(`
<h1>Kondygnacje</h1>
<div class="grid">
<div class="option" onclick="setFloors(1)">1</div>
<div class="option" onclick="setFloors(2)">2+</div>
</div>
`);
}

function stepGarden(){
set(`
<h1>Ogród</h1>
<div class="grid">
<div class="option" onclick="setGarden(true)">Tak</div>
<div class="option" onclick="setGarden(false)">Nie</div>
</div>
`);
}

function stepGarage(){
set(`
<h1>Garaż</h1>
<div class="grid">
<div class="option" onclick="setGarage(true)">Tak</div>
<div class="option" onclick="setGarage(false)">Nie</div>
</div>
`);
}

function stepCondition(){
set(`
<h1>Stan techniczny</h1>
<div class="grid">
<div class="option" onclick="setState('ideal')">Gotowy</div>
<div class="option" onclick="setState('refresh')">Odświeżenie</div>
<div class="option" onclick="setState('problem')">Problemy</div>
</div>
`);
}

function stepPhotos(){
set(`
<h1>Dodaj zdjęcia</h1>
<input type="file" multiple class="input">
<div class="option" onclick="finish()">Zakończ</div>
`);
}

/* ===== ACTIONS ===== */

function saveCity(){
let val = document.getElementById("city").value;
if(!val) return alert("Wpisz miasto");
data.city = val;
stepLocation();
}

function next(k,v){
data[k]=v;

if(k==="location") stepHouseSize();
else if(k==="houseSize") stepPlot();
else if(k==="plot") stepFloors();
}

/* SVG */

function drawBase(){
document.getElementById("svg").innerHTML =
`<path d="M100 200 L200 120 L300 200 V300 H100 Z"/>`;
}

function setFloors(n){
if(n===2){
document.getElementById("svg").innerHTML +=
`<line x1="100" y1="240" x2="300" y2="240"/>`;
}
stepGarden();
}

function setGarden(v){
if(v){
document.getElementById("svg").innerHTML +=
`<rect x="80" y="320" width="240" height="40"/>`;
}
stepGarage();
}

function setGarage(v){
if(v){
document.getElementById("svg").innerHTML +=
`<rect x="280" y="260" width="40" height="40"/>`;
}
stepCondition();
}

function setState(s){
data.state = s;

let svg = document.getElementById("svg");

if(s==="problem") svg.classList.add("problem");
if(s==="refresh") svg.classList.add("refresh");

if(s==="problem"){
set(`
<h1>OD ZERA+</h1>
<p>Przejmujemy nieruchomość od podstaw – rozwiązujemy problemy prawne, techniczne i przygotowujemy do sprzedaży.</p>
<div class="option" onclick="stepPhotos()">Dalej</div>
`);
}else{
stepPhotos();
}
}

/* END */

function finish(){
set(`<h1>Gotowe</h1><p>Dane zapisane</p>`);
console.log(data);
}

/* UI */

function set(html){
document.getElementById("content").innerHTML =
`<div class="fade">${html}</div>`;
}

</script>

</body>
</html>
