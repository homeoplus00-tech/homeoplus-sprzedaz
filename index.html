<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{margin:0;font-family:Montserrat;background:#1B1C1E;}

.container{display:flex;height:100vh;}
.left{width:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.right{width:50%;background:white;padding:80px;display:flex;flex-direction:column;justify-content:center;}

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:40%;width:100%;}
.right{height:60%;width:100%;padding:30px;}
}

h1{font-size:36px;font-weight:800;}
.option{border:1px solid #ddd;padding:14px;margin-top:10px;cursor:pointer;}
.input{margin-top:15px;padding:12px;width:100%;border:none;border-bottom:1px solid #ccc;}
.button{margin-top:20px;padding:14px;background:#ebdaa8;border:none;cursor:pointer;}

svg{width:300px;margin-bottom:40px;}
svg path, svg rect, svg line{
fill:none;stroke:#ebdaa8;stroke-width:2;
stroke-dasharray:400;stroke-dashoffset:400;transition:0.8s;
}
.draw path, .draw rect, .draw line{stroke-dashoffset:0;}

.card{color:#ebdaa8;}
.card strong{display:block;font-weight:800;}
.card span{opacity:0.8;font-size:14px;}

.problem path{stroke-dasharray:6;}

</style>
</head>

<body>

<div class="container">

<div class="left">

<svg id="svg" viewBox="0 0 400 400"></svg>

<div class="card">
<strong id="type"></strong>
<span id="details"></span>
</div>

</div>

<div class="right" id="content">
<h1>SPRZEDAŻ+</h1>
<button class="button" onclick="start()">Start</button>
</div>

</div>

<script>

let data={};

/* ===== FLOW ===== */

function start(){stepType();}

/* TYP */

function stepType(){
set(`
<h1>Typ nieruchomości</h1>
<div class="option" onclick="chooseType('mieszkanie')">Mieszkanie</div>
`);
}

/* POKOJE */

function stepRooms(){
set(`
<h1>Liczba pokoi</h1>
${[1,2,3,4,5].map(n=>`<div class="option" onclick="setRooms(${n})">${n===5?"5+":n}</div>`).join("")}
`);
}

/* METRAŻ */

function stepSize(){
set(`
<h1>Metraż (m²)</h1>
<input id="size" class="input" placeholder="np. 65">
<button class="button" onclick="saveSize()">Dalej</button>
`);
}

/* PIĘTRO */

function stepFloor(){
set(`
<h1>Piętro</h1>
<input id="floor" class="input" placeholder="np. 3">
<button class="button" onclick="saveFloor()">Dalej</button>
`);
}

/* BALKON */

function stepBalcony(){
set(`
<h1>Balkon</h1>
<div class="option" onclick="setBalcony(true)">Tak</div>
<div class="option" onclick="setBalcony(false)">Nie</div>
`);
}

/* STAN TECH */

function stepCondition(){
set(`
<h1>Stan techniczny</h1>
<div class="option" onclick="setCondition('ideal')">Gotowe</div>
<div class="option" onclick="setCondition('refresh')">Do odświeżenia</div>
<div class="option" onclick="setCondition('renovation')">Do remontu</div>
`);
}

/* STAN PRAWNY */

function stepLegal(){
set(`
<h1>Stan prawny</h1>
<div class="option" onclick="setLegal('clean')">Brak problemów</div>
<div class="option" onclick="setLegal('mortgage')">Kredyt</div>
<div class="option" onclick="setLegal('problem')">Problem prawny</div>
`);
}

/* ZDJĘCIA */

function stepPhotos(){
set(`
<h1>Zdjęcia nieruchomości</h1>
<input type="file" multiple class="input" onchange="savePhotos(event)">
`);
}

/* CENA */

function stepPrice(){
set(`
<h1>Oczekiwana cena</h1>
<input id="price" class="input" placeholder="np. 650000">
<button class="button" onclick="savePrice()">Dalej</button>
`);
}

/* ANALIZA */

function analyze(){

let c=document.getElementById("content");

if(data.legal==="problem" || data.condition==="renovation"){
c.innerHTML=`<h1>OD ZERA+</h1><p>Twoja nieruchomość wymaga pełnej obsługi.</p>`;
}else{
c.innerHTML=`<h1>SPRZEDAŻ+</h1><p>Gotowe do sprzedaży.</p>`;
}

}

/* ===== SVG ===== */

function drawBase(){
let svg=document.getElementById("svg");
svg.innerHTML=`<rect x="100" y="120" width="200" height="200"/>`;
animate();
}

function drawRooms(n){
let svg=document.getElementById("svg");
svg.querySelectorAll(".room").forEach(e=>e.remove());

if(n>=2)addLine(200,120,200,320);
if(n>=3)addLine(100,220,200,220);
if(n>=4)addLine(200,220,300,220);
if(n>=5)addLine(150,120,150,320);

animate();
}

function addLine(x1,y1,x2,y2){
let l=document.createElementNS("http://www.w3.org/2000/svg","line");
l.setAttribute("x1",x1);
l.setAttribute("y1",y1);
l.setAttribute("x2",x2);
l.setAttribute("y2",y2);
l.setAttribute("class","room");
document.getElementById("svg").appendChild(l);
}

function drawBalcony(show){
let svg=document.getElementById("svg");
let old=svg.querySelector("#balcony");
if(old)old.remove();

if(show){
let b=document.createElementNS("http://www.w3.org/2000/svg","rect");
b.setAttribute("x",150);
b.setAttribute("y",320);
b.setAttribute("width",100);
b.setAttribute("height",20);
b.setAttribute("id","balcony");
svg.appendChild(b);
}
animate();
}

function applyState(){
let svg=document.getElementById("svg");
svg.className="";

if(data.legal==="problem") svg.classList.add("problem");
}

/* ===== ACTIONS ===== */

function chooseType(t){
data.type=t;
drawBase();
document.getElementById("type").innerText="Mieszkanie";
stepRooms();
}

function setRooms(n){
data.rooms=n;
drawRooms(n);
document.getElementById("details").innerText=roomsText(n);
stepSize();
}

function saveSize(){
data.size=document.getElementById("size").value;
stepFloor();
}

function saveFloor(){
data.floor=document.getElementById("floor").value;
stepBalcony();
}

function setBalcony(v){
data.balcony=v;
drawBalcony(v);
stepCondition();
}

function setCondition(c){
data.condition=c;
stepLegal();
}

function setLegal(l){
data.legal=l;
applyState();
stepPhotos();
}

function savePhotos(e){
data.photos=e.target.files;
stepPrice();
}

function savePrice(){
data.price=document.getElementById("price").value;
analyze();
}

/* ===== UTILS ===== */

function roomsText(n){
if(n===1)return"1 pokój";
if(n<=4)return n+" pokoje";
return n+" pokoi";
}

function set(html){
document.getElementById("content").innerHTML=html;
}

function animate(){
let svg=document.getElementById("svg");
svg.classList.remove("draw");
setTimeout(()=>svg.classList.add("draw"),50);
}

</script>

</body>
</html>
