<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#0f1113;
color:white;
}

/* LAYOUT */

.container{
display:flex;
height:100vh;
}

.left{
width:50%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.right{
width:50%;
padding:80px;
display:flex;
flex-direction:column;
justify-content:center;
}

/* MOBILE */

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:40%;}
.right{height:60%;padding:30px;}
}

/* TYPO */

.hero{
font-size:42px;
font-weight:800;
color:#ebdaa8;
}

.sub{
opacity:0.6;
margin-top:15px;
margin-bottom:40px;
}

/* OPTIONS */

.option{
border:1px solid rgba(255,255,255,0.2);
padding:14px;
margin-top:10px;
cursor:pointer;
transition:0.25s;
}

.option:hover{
border-color:#ebdaa8;
color:#ebdaa8;
}

/* SVG */

svg{
width:280px;
margin-bottom:40px;
}

svg path, svg rect, svg line{
fill:none;
stroke:#ebdaa8;
stroke-width:2;
stroke-dasharray:400;
stroke-dashoffset:400;
transition:0.6s;
}

.draw path, .draw rect, .draw line{
stroke-dashoffset:0;
}

/* STANY */

.problem *{
stroke:red !important;
stroke-dasharray:6;
}

.refresh *{
opacity:0.4;
}

/* CARD */

.card{
color:#ebdaa8;
text-align:center;
}

.card strong{
font-weight:800;
display:block;
}

.card span{
opacity:0.7;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="left">

<svg id="svg" viewBox="0 0 400 400"></svg>

<div class="card">
<strong id="type"></strong>
<span id="details"></span>
</div>

</div>

<div class="right" id="content"></div>

</div>

<script>

/* ===== STATE ===== */

let data = {};
let flow = [];
let stepIndex = 0;

/* ===== START ===== */

start();

function start(){
set(`
<div class="hero">SPRZEDAŻ+</div>
<div class="sub">System sprzedaży nieruchomości — prowadzimy cały proces za Ciebie.</div>

<div class="option" onclick="chooseType('mieszkanie')">Mieszkanie</div>
<div class="option" onclick="chooseType('dom')">Dom</div>
<div class="option" onclick="chooseType('lokal')">Lokal usługowy</div>
<div class="option" onclick="chooseType('hala')">Magazyn / hala</div>
<div class="option" onclick="chooseType('dzialka')">Działka</div>
`);
}

/* ===== FLOW DEFINICJE ===== */

const flows = {

mieszkanie: [
stepRooms,
stepFloor,
stepBalcony,
stepState
],

dom: [
stepRooms,
stepGarden,
stepState
],

lokal: [
stepShopWindow,
stepTraffic,
stepState
],

hala: [
stepHeight,
stepGate,
stepState
],

dzialka: [
stepArea,
stepAccess,
stepState
]

};

/* ===== FLOW ===== */

function next(){
stepIndex++;

if(stepIndex < flow.length){
flow[stepIndex]();
}else{
analyze();
}
}

/* ===== STEPS ===== */

function stepRooms(){
set(`
<h1>Układ nieruchomości</h1>
<p>Określamy strukturę przestrzeni</p>

${[1,2,3,4,5].map(n=>`<div class="option" onclick="setRooms(${n})">${n===5?"5+":n}</div>`).join("")}
`);
}

function stepFloor(){
set(`
<h1>Pozycja w budynku</h1>
<p>Na którym piętrze znajduje się nieruchomość?</p>

<div class="option" onclick="setFloor('parter')">Parter</div>
<div class="option" onclick="setFloor('srodek')">Środkowe piętro</div>
<div class="option" onclick="setFloor('wysokie')">Wysokie piętro</div>
`);
}

function stepBalcony(){
set(`
<h1>Dodatkowa przestrzeń</h1>

<div class="option" onclick="setBalcony(true)">Balkon / taras</div>
<div class="option" onclick="setBalcony(false)">Brak</div>
`);
}

function stepGarden(){
set(`
<h1>Otoczenie nieruchomości</h1>

<div class="option" onclick="setGarden(true)">Ogród</div>
<div class="option" onclick="setGarden(false)">Brak</div>
`);
}

function stepShopWindow(){
set(`
<h1>Ekspozycja lokalu</h1>

<div class="option" onclick="setWindow(true)">Duża witryna</div>
<div class="option" onclick="setWindow(false)">Brak witryny</div>
`);
}

function stepTraffic(){
set(`
<h1>Ruch klientów</h1>

<div class="option" onclick="setTraffic('wysoki')">Wysoki</div>
<div class="option" onclick="setTraffic('niski')">Niski</div>
`);
}

function stepHeight(){
set(`
<h1>Wysokość hali</h1>

<div class="option" onclick="setHeight('niska')">Do 4m</div>
<div class="option" onclick="setHeight('wysoka')">Powyżej 4m</div>
`);
}

function stepGate(){
set(`
<h1>Dostęp logistyczny</h1>

<div class="option" onclick="setGate(true)">Brama wjazdowa</div>
<div class="option" onclick="setGate(false)">Brak</div>
`);
}

function stepArea(){
set(`
<h1>Wielkość działki</h1>

<div class="option" onclick="setArea('mala')">Mała</div>
<div class="option" onclick="setArea('duza')">Duża</div>
`);
}

function stepAccess(){
set(`
<h1>Dojazd</h1>

<div class="option" onclick="setAccess(true)">Droga dojazdowa</div>
<div class="option" onclick="setAccess(false)">Brak</div>
`);
}

function stepState(){
set(`
<h1>Stan nieruchomości</h1>

<div class="option" onclick="setState('ideal')">Gotowa</div>
<div class="option" onclick="setState('refresh')">Do odświeżenia</div>
<div class="option" onclick="setState('renovation')">Do remontu</div>
<div class="option" onclick="setState('problem')">Problemy prawne</div>
`);
}

/* ===== SVG ===== */

function drawBase(type){

let svg=document.getElementById("svg");
svg.innerHTML="";
svg.className="";

if(type==="mieszkanie") svg.innerHTML=`<rect x="100" y="120" width="200" height="200"/>`;
if(type==="dom") svg.innerHTML=`<path d="M100 200 L200 120 L300 200 V300 H100 Z"/>`;
if(type==="lokal") svg.innerHTML=`<rect x="120" y="180" width="160" height="120"/>`;
if(type==="hala") svg.innerHTML=`<rect x="80" y="200" width="240" height="100"/>`;
if(type==="dzialka") svg.innerHTML=`<rect x="100" y="220" width="200" height="80"/>`;

animate();
}

/* ===== REAKCJE SVG ===== */

function setRooms(n){
data.rooms=n;

drawLines(n);
updateDetails(n);

next();
}

function drawLines(n){
let svg=document.getElementById("svg");
svg.querySelectorAll("line").forEach(e=>e.remove());

for(let i=1;i<n;i++){
let l=document.createElementNS("http://www.w3.org/2000/svg","line");
l.setAttribute("x1",100+(i*(200/n)));
l.setAttribute("y1",120);
l.setAttribute("x2",100+(i*(200/n)));
l.setAttribute("y2",320);
svg.appendChild(l);
}

animate();
}

function setBalcony(v){
if(v){
let b=document.createElementNS("http://www.w3.org/2000/svg","rect");
b.setAttribute("x",150);
b.setAttribute("y",320);
b.setAttribute("width",100);
b.setAttribute("height",20);
document.getElementById("svg").appendChild(b);
}
animate();
next();
}

function setState(s){
data.state=s;

let svg=document.getElementById("svg");
svg.className="";

if(s==="problem") svg.classList.add("problem");
if(s==="refresh") svg.classList.add("refresh");

next();
}

/* ===== TYPE ===== */

function chooseType(t){
data={};
data.type=t;

drawBase(t);

document.getElementById("type").innerText=t.toUpperCase();

flow = flows[t];
stepIndex = 0;

flow[0]();
}

/* ===== ANALIZA ===== */

function analyze(){

if(data.state==="problem" || data.state==="renovation"){
set(`
<h1>OD ZERA+</h1>
<p>Zajmujemy się nieruchomościami wymagającymi pełnego procesu — od uporządkowania stanu prawnego po przygotowanie i sprzedaż.</p>
<div class="option">Sprawdź system OD ZERA+</div>
`);
}else{
set(`
<h1>SPRZEDAŻ+</h1>
<p>Przechodzimy do kolejnego etapu sprzedaży.</p>
`);
}

}

/* ===== UI ===== */

function set(html){
document.getElementById("content").innerHTML=html;
}

function updateDetails(n){
document.getElementById("details").innerText =
n===1?"1 pokój":
n<=4?n+" pokoje":
n+" pokoi";
}

function animate(){
let svg=document.getElementById("svg");
svg.classList.remove("draw");
setTimeout(()=>svg.classList.add("draw"),50);
}

</script>

</body>
</html>
