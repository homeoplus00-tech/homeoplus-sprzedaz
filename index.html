<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#0f1113;
color:white;
}

.container{
display:flex;
height:100vh;
}

.left{
width:50%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.right{
width:50%;
padding:60px;
display:flex;
flex-direction:column;
justify-content:center;
}

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:45%;}
.right{height:55%;padding:25px;}
}

/* UI */

.option{
border:1px solid rgba(255,255,255,0.2);
padding:12px;
margin-top:10px;
cursor:pointer;
}

.option:hover{
border-color:#ebdaa8;
color:#ebdaa8;
}

.slider{
width:100%;
margin-top:20px;
}

.value{
color:#ebdaa8;
margin-top:10px;
}

/* SVG */

svg{
width:280px;
}

svg rect{
stroke:#ebdaa8;
stroke-width:2;
fill:none;
}

</style>
</head>

<body>

<div class="container">

<div class="left">

<svg id="svg" viewBox="0 0 400 400"></svg>

<div id="summary"></div>

</div>

<div class="right" id="content"></div>

</div>

<script>

let data = {};
let flow = [];
let stepIndex = 0;

/* START */

start();

function start(){
set(`
<h1>SPRZEDAŻ+</h1>
<p>Przejmujemy proces sprzedaży nieruchomości.</p>

<div class="option" onclick="chooseType('mieszkanie')">Mieszkanie</div>
<div class="option" onclick="chooseType('dom')">Dom</div>
<div class="option" onclick="chooseType('lokal')">Lokal</div>
<div class="option" onclick="chooseType('hala')">Hala</div>
<div class="option" onclick="chooseType('dzialka')">Działka</div>
`);
}

/* FLOW */

function next(){
stepIndex++;
if(stepIndex < flow.length){
flow[stepIndex]();
}else{
analyze();
}
}

/* FLOWS */

const flows = {

mieszkanie: [cityStep, sizeStep, roomsStep, floorStep, stateStep],
dom: [cityStep, sizeStep, gardenStep, stateStep],
lokal: [cityStep, sizeStep, trafficStep, stateStep],
hala: [cityStep, sizeStep, heightStep, stateStep],
dzialka: [cityStep, sizeStep, accessStep, stateStep]

};

/* STEPS */

function cityStep(){
set(`
<h1>Lokalizacja</h1>
<input id="city" placeholder="Miasto" class="slider">
<div class="option" onclick="saveCity()">Dalej</div>
`);
}

function sizeStep(){
set(`
<h1>Metraż</h1>
<input type="range" min="20" max="500" value="100" class="slider"
oninput="updateSize(this.value)">
<div class="value" id="sizeVal">100 m²</div>
<div class="option" onclick="confirmSize()">Dalej</div>
`);
}

function roomsStep(){
set(`
<h1>Pokoje</h1>
${[1,2,3,4,5].map(n=>`<div class="option" onclick="setRooms(${n})">${n}</div>`).join("")}
`);
}

function floorStep(){
set(`
<h1>Piętro</h1>
<input type="range" min="0" max="10" value="2"
oninput="updateFloor(this.value)" class="slider">
<div class="value" id="floorVal">2</div>
<div class="option" onclick="confirmFloor()">Dalej</div>
`);
}

function gardenStep(){
set(`
<h1>Ogród</h1>
<div class="option" onclick="setGarden(true)">Tak</div>
<div class="option" onclick="setGarden(false)">Nie</div>
`);
}

function trafficStep(){
set(`
<h1>Ruch</h1>
<div class="option" onclick="setTraffic('wysoki')">Wysoki</div>
<div class="option" onclick="setTraffic('niski')">Niski</div>
`);
}

function heightStep(){
set(`
<h1>Wysokość hali</h1>
<input type="range" min="2" max="12" value="5"
oninput="updateHeight(this.value)" class="slider">
<div class="value" id="heightVal">5 m</div>
<div class="option" onclick="confirmHeight()">Dalej</div>
`);
}

function accessStep(){
set(`
<h1>Dojazd</h1>
<div class="option" onclick="setAccess(true)">Jest</div>
<div class="option" onclick="setAccess(false)">Brak</div>
`);
}

function stateStep(){
set(`
<h1>Stan</h1>
<div class="option" onclick="setState('ideal')">Gotowa</div>
<div class="option" onclick="setState('renovation')">Remont</div>
<div class="option" onclick="setState('problem')">Problemy</div>
`);
}

/* ACTIONS */

function chooseType(t){
data={};
data.type=t;

drawBase(t);

flow = flows[t];
stepIndex=0;

flow[0]();
}

function saveCity(){
data.city=document.getElementById("city").value;
next();
}

function updateSize(v){
document.getElementById("sizeVal").innerText=v+" m²";
}

function confirmSize(){
data.size=document.getElementById("sizeVal").innerText;
next();
}

function setRooms(n){
data.rooms=n;
next();
}

function updateFloor(v){
document.getElementById("floorVal").innerText=v;
}

function confirmFloor(){
data.floor=document.getElementById("floorVal").innerText;
next();
}

function setGarden(v){
data.garden=v;
next();
}

function setTraffic(v){
data.traffic=v;
next();
}

function updateHeight(v){
document.getElementById("heightVal").innerText=v+" m";
}

function confirmHeight(){
data.height=document.getElementById("heightVal").innerText;
next();
}

function setAccess(v){
data.access=v;
next();
}

function setState(s){
data.state=s;
next();
}

/* SVG */

function drawBase(type){
let svg=document.getElementById("svg");
svg.innerHTML=`<rect x="100" y="200" width="200" height="100"/>`;
}

/* ANALIZA */

function analyze(){
set(`<h1>Gotowe</h1><p>Dane zapisane</p>`);
}

/* UI */

function set(html){
document.getElementById("content").innerHTML=html;
}

</script>
</body>
</html>
