<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#0f1113;
color:white;
}

/* LAYOUT */

.container{
display:flex;
height:100vh;
}

.left{
width:50%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.right{
width:50%;
padding:80px;
display:flex;
flex-direction:column;
justify-content:center;
}

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:45%;}
.right{height:55%;padding:25px;}
svg{width:200px;}
}

/* TYPO */

h1{font-size:36px;font-weight:800;}
.sub{opacity:0.6;margin-bottom:30px;}

/* OPTION */

.option{
border:1px solid rgba(255,255,255,0.2);
padding:14px;
margin-top:10px;
cursor:pointer;
}

.option:hover{
border-color:#ebdaa8;
color:#ebdaa8;
}

/* SLIDER */

.slider{
width:100%;
margin-top:20px;
}

.value{
margin-top:10px;
color:#ebdaa8;
}

/* SVG */

svg{
width:300px;
margin-bottom:30px;
}

svg path, svg rect, svg line{
fill:none;
stroke:#ebdaa8;
stroke-width:2;
transition:0.4s;
}

/* CARD */

.card{
color:#ebdaa8;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="left">

<svg id="svg" viewBox="0 0 400 400"></svg>

<div class="card">
<div id="type"></div>
<div id="details"></div>
</div>

</div>

<div class="right" id="content"></div>

</div>

<script>

let data = {};
let flow = [];
let stepIndex = 0;

/* START */

start();

function start(){
set(`
<h1>SPRZEDAŻ+</h1>
<div class="sub">Prowadzimy sprzedaż od początku do końca.</div>

<div class="option" onclick="chooseType('hala')">Magazyn / hala</div>
`);
}

/* FLOW */

const flows = {
hala: [stepHeightSlider, stepSizeSlider, stepState]
};

function next(){
stepIndex++;
if(stepIndex < flow.length){
flow[stepIndex]();
}else{
analyze();
}
}

/* STEPS */

function stepHeightSlider(){
set(`
<h1>Określamy wysokość hali</h1>

<input type="range" min="2" max="12" value="5" class="slider"
oninput="updateHeight(this.value)">

<div class="value" id="heightValue">5 m</div>

<div class="option" onclick="confirmHeight()">Dalej</div>
`);
}

function stepSizeSlider(){
set(`
<h1>Powierzchnia</h1>

<input type="range" min="50" max="1000" value="200" class="slider"
oninput="updateSize(this.value)">

<div class="value" id="sizeValue">200 m²</div>

<div class="option" onclick="confirmSize()">Dalej</div>
`);
}

function stepState(){
set(`
<h1>Stan</h1>

<div class="option" onclick="setState('ideal')">Gotowa</div>
<div class="option" onclick="setState('renovation')">Remont</div>
<div class="option" onclick="setState('problem')">Problemy</div>
`);
}

/* SVG */

function drawBase(){
let svg=document.getElementById("svg");
svg.innerHTML=`<rect id="hall" x="100" y="250" width="200" height="80"/>`;
}

function updateHeight(val){
document.getElementById("heightValue").innerText = val + " m";

let hall = document.getElementById("hall");
hall.setAttribute("height", val * 10);
hall.setAttribute("y", 300 - val * 10);
}

function updateSize(val){
document.getElementById("sizeValue").innerText = val + " m²";

let hall = document.getElementById("hall");
hall.setAttribute("width", val / 2);
}

/* ACTIONS */

function chooseType(t){
data.type=t;
drawBase();
flow = flows[t];
stepIndex=0;
flow[0]();
}

function confirmHeight(){
data.height=document.getElementById("heightValue").innerText;
next();
}

function confirmSize(){
data.size=document.getElementById("sizeValue").innerText;
next();
}

function setState(s){
data.state=s;
next();
}

/* ANALIZA */

function analyze(){
set(`<h1>Gotowe</h1><p>Dane zapisane</p>`);
}

/* UI */

function set(html){
document.getElementById("content").innerHTML=html;
}

</script>

</body>
</html>
