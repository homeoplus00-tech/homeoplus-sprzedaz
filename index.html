<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#0f1113;
color:white;
}

.container{
display:flex;
height:100vh;
}

.left{
width:50%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.right{
width:50%;
padding:60px;
display:flex;
flex-direction:column;
justify-content:center;
}

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:45%;}
.right{height:55%;padding:25px;}
}

/* UI */

h1{
font-size:32px;
font-weight:800;
}

.sub{
opacity:0.6;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.option{
border:1px solid rgba(255,255,255,0.2);
padding:14px;
cursor:pointer;
text-align:center;
}

.option:hover{
border-color:#ebdaa8;
color:#ebdaa8;
}

/* SVG */

svg{
width:280px;
margin-bottom:20px;
}

svg rect, svg path, svg line{
stroke:#ebdaa8;
stroke-width:2;
fill:none;
transition:0.3s;
}

/* STATES */

.problem *{
stroke:red !important;
stroke-dasharray:6;
}

.refresh *{
opacity:0.5;
}

/* CARD */

.card{
color:#ebdaa8;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="left">

<svg id="svg" viewBox="0 0 400 400"></svg>

<div class="card">
<div id="type"></div>
<div id="details"></div>
</div>

</div>

<div class="right" id="content"></div>

</div>

<script>

let data = {};
let flow = [];
let stepIndex = 0;

/* START */

start();

function start(){
set(`
<h1 style="color:#ebdaa8;">SPRZEDAŻ+</h1>
<div class="sub">Prowadzimy sprzedaż nieruchomości kompleksowo.</div>

<div class="grid">
<div class="option" onclick="chooseType('mieszkanie')">Mieszkanie</div>
<div class="option" onclick="chooseType('dom')">Dom</div>
<div class="option" onclick="chooseType('lokal')">Lokal</div>
<div class="option" onclick="chooseType('hala')">Hala</div>
<div class="option" onclick="chooseType('dzialka')">Działka</div>
</div>
`);
}

/* FLOW CONTROL */

function next(){
stepIndex++;
if(stepIndex < flow.length){
flow[stepIndex]();
}else{
analyze();
}
}

/* FLOWS */

const flows = {

mieszkanie: [
cityStep,
locationTypeStep,
sizeStep,
roomsStep,
floorStep,
elevatorStep,
balconyStep,
parkingStep,
stateStep
],

dom: [
cityStep,
sizeStep,
plotStep,
floorsStep,
gardenStep,
garageStep,
stateStep
],

lokal: [
cityStep,
sizeStep,
purposeStep,
windowStep,
trafficStep,
stateStep
],

hala: [
cityStep,
sizeStep,
heightStep,
gateStep,
truckStep,
stateStep
],

dzialka: [
cityStep,
sizeStep,
typeStep,
accessStep,
mediaStep,
stateStep
]

};

/* ===== COMMON STEPS ===== */

function cityStep(){
set(`
<h1>Lokalizacja</h1>
<input class="option" id="city" placeholder="Miasto">
<div class="option" onclick="saveCity()">Dalej</div>
`);
}

function locationTypeStep(){
set(`
<h1>Położenie</h1>
<div class="grid">
<div class="option" onclick="setLocation('centrum')">Centrum</div>
<div class="option" onclick="setLocation('poza')">Poza centrum</div>
</div>
`);
}

function sizeStep(){
set(`
<h1>Metraż</h1>
<div class="grid">
<div class="option" onclick="setSize(40)">do 40 m²</div>
<div class="option" onclick="setSize(60)">40–60 m²</div>
<div class="option" onclick="setSize(100)">60–100 m²</div>
<div class="option" onclick="setSize(200)">100+ m²</div>
</div>
`);
}

/* ===== MIESZKANIE ===== */

function roomsStep(){
set(`
<h1>Pokoje</h1>
<div class="grid">
${[1,2,3,4,5].map(n=>`<div class="option" onclick="setRooms(${n})">${n}</div>`).join("")}
</div>
`);
}

function floorStep(){
set(`
<h1>Piętro</h1>
<div class="grid">
<div class="option" onclick="setFloor('parter')">Parter</div>
<div class="option" onclick="setFloor('srodek')">Środkowe</div>
<div class="option" onclick="setFloor('wysokie')">Wysokie</div>
</div>
`);
}

function elevatorStep(){
set(`
<h1>Winda</h1>
<div class="grid">
<div class="option" onclick="setElevator(true)">Tak</div>
<div class="option" onclick="setElevator(false)">Nie</div>
</div>
`);
}

function balconyStep(){
set(`
<h1>Balkon</h1>
<div class="grid">
<div class="option" onclick="setBalcony(true)">Tak</div>
<div class="option" onclick="setBalcony(false)">Nie</div>
</div>
`);
}

function parkingStep(){
set(`
<h1>Parking</h1>
<div class="grid">
<div class="option" onclick="setParking(true)">Tak</div>
<div class="option" onclick="setParking(false)">Nie</div>
</div>
`);
}

/* ===== DOM ===== */

function plotStep(){
set(`<h1>Działka</h1>
<div class="grid">
<div class="option" onclick="next()">Mała</div>
<div class="option" onclick="next()">Duża</div>
</div>`);
}

function floorsStep(){
set(`<h1>Kondygnacje</h1>
<div class="grid">
<div class="option" onclick="next()">1</div>
<div class="option" onclick="next()">2+</div>
</div>`);
}

function gardenStep(){
set(`<h1>Ogród</h1>
<div class="grid">
<div class="option" onclick="setGarden(true)">Tak</div>
<div class="option" onclick="setGarden(false)">Nie</div>
</div>`);
}

function garageStep(){
set(`<h1>Garaż</h1>
<div class="grid">
<div class="option" onclick="setGarage(true)">Tak</div>
<div class="option" onclick="setGarage(false)">Nie</div>
</div>`);
}

/* ===== LOKAL ===== */

function purposeStep(){
set(`<h1>Przeznaczenie</h1>
<div class="grid">
<div class="option" onclick="next()">Handel</div>
<div class="option" onclick="next()">Biuro</div>
<div class="option" onclick="next()">Gastronomia</div>
</div>`);
}

function windowStep(){
set(`<h1>Witryna</h1>
<div class="grid">
<div class="option" onclick="setWindow(true)">Tak</div>
<div class="option" onclick="setWindow(false)">Nie</div>
</div>`);
}

function trafficStep(){
set(`<h1>Ruch</h1>
<div class="grid">
<div class="option" onclick="next()">Wysoki</div>
<div class="option" onclick="next()">Niski</div>
</div>`);
}

/* ===== HALA ===== */

function heightStep(){
set(`<h1>Wysokość</h1>
<div class="grid">
<div class="option" onclick="setHeight('niska')">do 4m</div>
<div class="option" onclick="setHeight('wysoka')">4m+</div>
</div>`);
}

function gateStep(){
set(`<h1>Brama</h1>
<div class="grid">
<div class="option" onclick="setGate(true)">Tak</div>
<div class="option" onclick="setGate(false)">Nie</div>
</div>`);
}

function truckStep(){
set(`<h1>Dostęp TIR</h1>
<div class="grid">
<div class="option" onclick="next()">Tak</div>
<div class="option" onclick="next()">Nie</div>
</div>`);
}

/* ===== DZIAŁKA ===== */

function typeStep(){
set(`<h1>Typ</h1>
<div class="grid">
<div class="option" onclick="next()">Budowlana</div>
<div class="option" onclick="next()">Rolna</div>
</div>`);
}

function accessStep(){
set(`<h1>Dojazd</h1>
<div class="grid">
<div class="option" onclick="setAccess(true)">Tak</div>
<div class="option" onclick="setAccess(false)">Nie</div>
</div>`);
}

function mediaStep(){
set(`<h1>Media</h1>
<div class="grid">
<div class="option" onclick="next()">Tak</div>
<div class="option" onclick="next()">Nie</div>
</div>`);
}

/* ===== STATE ===== */

function stateStep(){
set(`
<h1>Stan</h1>
<div class="grid">
<div class="option" onclick="setState('ideal')">Gotowa</div>
<div class="option" onclick="setState('refresh')">Odświeżenie</div>
<div class="option" onclick="setState('problem')">Problemy</div>
</div>
`);
}

/* ===== ACTIONS ===== */

function chooseType(t){
data={};
data.type=t;
drawBase(t);
flow=flows[t];
stepIndex=0;
flow[0]();
}

function saveCity(){
data.city=document.getElementById("city").value;
next();
}

function setLocation(v){data.location=v;next();}
function setSize(v){data.size=v;next();}

function setRooms(n){
let svg=document.getElementById("svg");
svg.querySelectorAll("line").forEach(e=>e.remove());

for(let i=1;i<n;i++){
let l=document.createElementNS("http://www.w3.org/2000/svg","line");
l.setAttribute("x1",100+(i*(200/n)));
l.setAttribute("y1",120);
l.setAttribute("x2",100+(i*(200/n)));
l.setAttribute("y2",320);
svg.appendChild(l);
}
next();
}

function setFloor(v){
if(v==="wysokie") document.getElementById("svg").style.transform="translateY(-20px)";
next();
}

function setElevator(v){next();}
function setBalcony(v){
if(v){
let b=document.createElementNS("http://www.w3.org/2000/svg","rect");
b.setAttribute("x",150);b.setAttribute("y",320);
b.setAttribute("width",100);b.setAttribute("height",20);
document.getElementById("svg").appendChild(b);
}
next();
}

function setParking(v){next();}
function setGarden(v){
if(v){
let g=document.createElementNS("http://www.w3.org/2000/svg","rect");
g.setAttribute("x",80);g.setAttribute("y",320);
g.setAttribute("width",240);g.setAttribute("height",40);
document.getElementById("svg").appendChild(g);
}
next();
}

function setGarage(v){next();}
function setWindow(v){
if(v){
let w=document.createElementNS("http://www.w3.org/2000/svg","rect");
w.setAttribute("x",150);w.setAttribute("y",200);
w.setAttribute("width",100);w.setAttribute("height",40);
document.getElementById("svg").appendChild(w);
}
next();
}

function setHeight(v){
if(v==="wysoka"){
document.getElementById("svg").querySelector("rect").setAttribute("height",140);
}
next();
}

function setGate(v){
if(v){
let g=document.createElementNS("http://www.w3.org/2000/svg","rect");
g.setAttribute("x",180);g.setAttribute("y",260);
g.setAttribute("width",40);g.setAttribute("height",40);
document.getElementById("svg").appendChild(g);
}
next();
}

function setAccess(v){next();}
function setState(s){data.state=s;next();}

/* SVG */

function drawBase(type){
let svg=document.getElementById("svg");
svg.innerHTML=`<rect x="100" y="120" width="200" height="200"/>`;
}

/* ANALIZA */

function analyze(){
set(`<h1>Gotowe</h1><p>Dane zapisane</p>`);
}

/* UI */

function set(html){
document.getElementById("content").innerHTML=html;
}

</script>

</body>
</html>
