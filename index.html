<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#0f1113;
color:white;
}

.container{
display:flex;
height:100vh;
}

.left, .right{
width:50%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.right{
align-items:flex-start;
padding:50px;
}

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:40%;}
.right{height:60%;width:100%;padding:20px;}
}

/* GRID */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
width:100%;
max-width:420px;
}

.option{
border:1px solid rgba(255,255,255,0.2);
padding:14px;
text-align:center;
cursor:pointer;
transition:0.2s;
}

.option:hover{
border-color:#ebdaa8;
color:#ebdaa8;
}

/* SVG */

svg{
width:280px;
}

.layer *{
stroke:#ebdaa8;
stroke-width:2;
fill:none;
}

/* STATE */

.problem *{
stroke:red !important;
stroke-dasharray:6;
}

.refresh *{
opacity:0.4;
}

/* TEXT */

h1{
font-size:30px;
font-weight:800;
margin-bottom:15px;
}

.sub{
opacity:0.6;
margin-bottom:20px;
}

.card{
color:#ebdaa8;
margin-top:20px;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="left">

<svg viewBox="0 0 400 400">
<g id="base"></g>
<g id="features"></g>
<g id="overlay"></g>
</svg>

<div class="card">
<div id="type"></div>
<div id="details"></div>
</div>

</div>

<div class="right" id="content"></div>

</div>

<script>

let data={}, flow=[], step=0;

/* START */

start();

function start(){
set(`
<h1 style="color:#ebdaa8;">SPRZEDAŻ+</h1>
<div class="sub">Prowadzimy sprzedaż nieruchomości kompleksowo.</div>

<div class="grid">
<div class="option" onclick="choose('mieszkanie')">Mieszkanie</div>
<div class="option" onclick="choose('dom')">Dom</div>
<div class="option" onclick="choose('lokal')">Lokal</div>
<div class="option" onclick="choose('hala')">Hala</div>
<div class="option" onclick="choose('dzialka')">Działka</div>
</div>
`);
}

/* FLOW */

function next(){
step++;
if(step<flow.length){flow[step]();}
else analyze();
}

/* FLOWS */

const flows={

mieszkanie:[
city, location, size, rooms, floor, elevator, balcony, parking, standard, state
],

dom:[
city, location, size, plot, floors, garden, garage, standard, state
],

lokal:[
city, location, size, purpose, windowQ, traffic, standard, state
],

hala:[
city, location, size, height, gate, tir, standard, state
],

dzialka:[
city, location, size, typeQ, access, media, state
]

};

/* ===== COMMON ===== */

function city(){
set(`<h1>Lokalizacja</h1>
<input class="option" id="city" placeholder="Miasto">
<div class="option" onclick="saveCity()">Dalej</div>`);
}

function location(){
set(`<h1>Położenie</h1>
<div class="grid">
<div class="option" onclick="save('loc','centrum')">Centrum</div>
<div class="option" onclick="save('loc','poza')">Poza centrum</div>
</div>`);
}

function size(){
set(`<h1>Metraż</h1>
<div class="grid">
<div class="option" onclick="save('size','<40')">do 40 m²</div>
<div class="option" onclick="save('size','40-60')">40–60</div>
<div class="option" onclick="save('size','60-100')">60–100</div>
<div class="option" onclick="save('size','100+')">100+</div>
</div>`);
}

/* ===== MIESZKANIE ===== */

function rooms(){
set(`<h1>Pokoje</h1>
<div class="grid">
${[1,2,3,4,'5+'].map(n=>`<div class="option" onclick="setRooms('${n}')">${n}</div>`).join("")}
</div>`);
}

function floor(){
set(`<h1>Piętro</h1>
<div class="grid">
<div class="option" onclick="saveFloor('parter')">Parter</div>
<div class="option" onclick="saveFloor('srodek')">Środkowe</div>
<div class="option" onclick="saveFloor('wysokie')">Wysokie</div>
</div>`);
}

function elevator(){simple("Winda","elevator");}
function balcony(){feature("Balkon","balcony");}
function parking(){simple("Parking","parking");}
function standard(){simple("Standard","standard");}

/* ===== DOM ===== */

function plot(){simple("Działka","plot");}
function floors(){simple("Kondygnacje","floors");}
function garden(){feature("Ogród","garden");}
function garage(){feature("Garaż","garage");}

/* ===== LOKAL ===== */

function purpose(){simple("Przeznaczenie","purpose");}
function windowQ(){feature("Witryna","window");}
function traffic(){simple("Ruch","traffic");}

/* ===== HALA ===== */

function height(){
set(`<h1>Wysokość</h1>
<div class="grid">
<div class="option" onclick="setHeight('low')">do 4m</div>
<div class="option" onclick="setHeight('high')">4m+</div>
</div>`);
}

function gate(){feature("Brama","gate");}
function tir(){simple("Dostęp TIR","tir");}

/* ===== DZIAŁKA ===== */

function typeQ(){simple("Typ działki","type");}
function access(){feature("Dojazd","access");}
function media(){simple("Media","media");}

/* ===== STATE ===== */

function state(){
set(`<h1>Stan</h1>
<div class="grid">
<div class="option" onclick="setState('ideal')">Gotowa</div>
<div class="option" onclick="setState('refresh')">Odświeżenie</div>
<div class="option" onclick="setState('problem')">Problemy</div>
</div>`);
}

/* ===== GENERIC ===== */

function simple(title,key){
set(`<h1>${title}</h1>
<div class="grid">
<div class="option" onclick="save('${key}','tak')">Tak</div>
<div class="option" onclick="save('${key}','nie')">Nie</div>
</div>`);
}

function feature(title,key){
set(`<h1>${title}</h1>
<div class="grid">
<div class="option" onclick="addFeature('${key}',true)">Tak</div>
<div class="option" onclick="addFeature('${key}',false)">Nie</div>
</div>`);
}

/* ===== ACTIONS ===== */

function choose(t){
data={type:t};
drawBase(t);
flow=flows[t];
step=0;
flow[0]();
document.getElementById("type").innerText=t.toUpperCase();
}

function saveCity(){
data.city=document.getElementById("city").value;
next();
}

function save(k,v){
data[k]=v;
next();
}

/* SVG */

function drawBase(t){
let base=document.getElementById("base");
base.innerHTML=`<rect x="100" y="120" width="200" height="200"/>`;
clear();
}

function clear(){
document.getElementById("features").innerHTML="";
document.getElementById("overlay").innerHTML="";
}

function setRooms(n){
let overlay=document.getElementById("overlay");
overlay.innerHTML="";
let count = n==='5+'?5:n;

for(let i=1;i<count;i++){
let x=100+(i*(200/count));
overlay.innerHTML+=`<line x1="${x}" y1="120" x2="${x}" y2="320"/>`;
}
next();
}

function saveFloor(v){
if(v==="wysokie"){
document.querySelector("svg").style.transform="translateY(-15px)";
}
next();
}

function addFeature(type,val){
if(!val){next();return;}
let f=document.getElementById("features");

if(type==="balcony") f.innerHTML+=`<rect x="150" y="320" width="100" height="20"/>`;
if(type==="garden") f.innerHTML+=`<rect x="80" y="320" width="240" height="40"/>`;
if(type==="garage") f.innerHTML+=`<rect x="280" y="260" width="40" height="40"/>`;
if(type==="window") f.innerHTML+=`<rect x="150" y="200" width="100" height="40"/>`;
if(type==="gate") f.innerHTML+=`<rect x="180" y="260" width="40" height="40"/>`;
if(type==="access") f.innerHTML+=`<line x1="0" y1="300" x2="100" y2="260"/>`;

next();
}

function setHeight(v){
let base=document.getElementById("base").querySelector("rect");
if(v==="high") base.setAttribute("height",140);
next();
}

function setState(s){
data.state=s;
next();
}

/* ANALIZA */

function analyze(){
if(data.state==="problem"){
set(`<h1>OD ZERA+</h1><p>Przejmujemy nieruchomość i rozwiązujemy wszystkie problemy.</p>`);
}else{
set(`<h1>SPRZEDAŻ+</h1><p>Przechodzimy do sprzedaży.</p>`);
}
}

/* UI */

function set(html){
document.getElementById("content").innerHTML=html;
}

</script>

</body>
</html>
