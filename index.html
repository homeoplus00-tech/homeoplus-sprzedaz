<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMEO+</title>

<style>
body{
margin:0;
background:#0f1113;
color:white;
font-family:Montserrat, sans-serif;
}

.container{
display:flex;
height:100vh;
}

.left,.right{
width:50%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.right{
align-items:flex-start;
padding:50px;
}

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:40%;}
.right{height:60%;width:100%;padding:20px;}
}

/* UI */

h1{
font-size:28px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
width:100%;
max-width:400px;
}

.option{
border:1px solid #444;
padding:12px;
cursor:pointer;
text-align:center;
}

.option:hover{
border-color:#ebdaa8;
color:#ebdaa8;
}

/* SVG */

svg{
width:260px;
}

line, rect{
stroke:#ebdaa8;
fill:none;
stroke-width:2;
}

/* STATES */

.problem *{
stroke:red !important;
stroke-dasharray:6;
}

.refresh *{
opacity:0.5;
}

</style>
</head>

<body>

<div class="container">

<div class="left">
<svg id="svg" viewBox="0 0 400 400"></svg>
</div>

<div class="right" id="content"></div>

</div>

<script>

/* STATE */

let data = {};

/* START */

start();

function start(){
document.getElementById("content").innerHTML = `
<h1>SPRZEDAŻ+</h1>
<div class="option" onclick="startFlow()">Rozpocznij</div>
`;
}

/* FLOW */

function startFlow(){
drawBase();
stepCity();
}

/* ===== STEPS ===== */

function stepCity(){
set(`
<h1>Lokalizacja</h1>
<input id="city" class="option" placeholder="Miasto">
<div class="option" onclick="saveCity()">Dalej</div>
`);
}

function stepLocation(){
set(`
<h1>Położenie</h1>
<div class="grid">
<div class="option" onclick="save('location','centrum')">Centrum</div>
<div class="option" onclick="save('location','poza')">Poza centrum</div>
</div>
`);
}

function stepSize(){
set(`
<h1>Metraż</h1>
<div class="grid">
<div class="option" onclick="save('size','<40')">do 40</div>
<div class="option" onclick="save('size','40-60')">40–60</div>
<div class="option" onclick="save('size','60-100')">60–100</div>
<div class="option" onclick="save('size','100+')">100+</div>
</div>
`);
}

function stepRooms(){
set(`
<h1>Pokoje</h1>
<div class="grid">
${[1,2,3,4,'5+'].map(n=>`<div class="option" onclick="setRooms('${n}')">${n}</div>`).join("")}
</div>
`);
}

function stepFloor(){
set(`
<h1>Piętro</h1>
<div class="grid">
<div class="option" onclick="setFloor(0)">Parter</div>
<div class="option" onclick="setFloor(-10)">Środek</div>
<div class="option" onclick="setFloor(-20)">Wysokie</div>
</div>
`);
}

function stepElevator(){
set(`
<h1>Winda</h1>
<div class="grid">
<div class="option" onclick="save('elevator',true)">Tak</div>
<div class="option" onclick="save('elevator',false)">Nie</div>
</div>
`);
}

function stepBalcony(){
set(`
<h1>Balkon / taras</h1>
<div class="grid">
<div class="option" onclick="setBalcony(true)">Tak</div>
<div class="option" onclick="setBalcony(false)">Nie</div>
</div>
`);
}

function stepParking(){
set(`
<h1>Parking</h1>
<div class="grid">
<div class="option" onclick="save('parking',true)">Tak</div>
<div class="option" onclick="save('parking',false)">Nie</div>
</div>
`);
}

function stepStandard(){
set(`
<h1>Standard</h1>
<div class="grid">
<div class="option" onclick="save('standard','premium')">Premium</div>
<div class="option" onclick="save('standard','ok')">Dobry</div>
<div class="option" onclick="save('standard','remont')">Do remontu</div>
</div>
`);
}

function stepState(){
set(`
<h1>Stan prawny / sytuacja</h1>
<div class="grid">
<div class="option" onclick="setState('ideal')">Gotowa</div>
<div class="option" onclick="setState('refresh')">Do odświeżenia</div>
<div class="option" onclick="setState('problem')">Problemy</div>
</div>
`);
}

/* ===== ACTIONS ===== */

function saveCity(){
data.city = document.getElementById("city").value;
stepLocation();
}

function save(k,v){
data[k]=v;

if(k==="location") stepSize();
else if(k==="size") stepRooms();
else if(k==="elevator") stepBalcony();
else if(k==="parking") stepStandard();
else if(k==="standard") stepState();
}

/* SVG */

function drawBase(){
let svg = document.getElementById("svg");
svg.innerHTML = `<rect x="100" y="120" width="200" height="200"/>`;
}

/* ROOMS */

function setRooms(n){
let svg = document.getElementById("svg");

drawBase();

let count = n==="5+"?5:n;

for(let i=1;i<count;i++){
let x = 100 + (i*(200/count));
svg.innerHTML += `<line x1="${x}" y1="120" x2="${x}" y2="320"/>`;
}

stepFloor();
}

/* FLOOR */

function setFloor(val){
document.getElementById("svg").style.transform=`translateY(${val}px)`;
stepElevator();
}

/* BALCONY */

function setBalcony(v){
if(v){
document.getElementById("svg").innerHTML +=
`<rect x="150" y="320" width="100" height="20"/>`;
}
stepParking();
}

/* STATE */

function setState(s){
data.state = s;

let svg = document.getElementById("svg");

if(s==="problem") svg.classList.add("problem");
if(s==="refresh") svg.classList.add("refresh");

finish();
}

/* END */

function finish(){

if(data.state==="problem"){
set(`<h1>OD ZERA+</h1><p>Zajmujemy się wszystkim od podstaw.</p>`);
}else{
set(`<h1>SPRZEDAŻ+</h1><p>Przechodzimy dalej.</p>`);
}

console.log(data);
}

/* UI */

function set(html){
document.getElementById("content").innerHTML = html;
}

</script>

</body>
</html>
