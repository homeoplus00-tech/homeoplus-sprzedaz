<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#0f1113;
color:white;
}

/* LAYOUT */

.container{
display:flex;
height:100vh;
}

.left, .right{
width:50%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.right{
align-items:flex-start;
padding:60px;
}

/* MOBILE */

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:40%;}
.right{height:60%;padding:20px;width:100%;}
}

/* GRID */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
width:100%;
max-width:400px;
}

.option{
border:1px solid rgba(255,255,255,0.2);
padding:14px;
text-align:center;
cursor:pointer;
transition:0.2s;
}

.option:hover{
border-color:#ebdaa8;
color:#ebdaa8;
}

/* SVG */

svg{
width:280px;
}

.layer path, .layer rect, .layer line{
stroke:#ebdaa8;
stroke-width:2;
fill:none;
}

/* CARD */

.card{
color:#ebdaa8;
margin-top:20px;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="left">

<svg id="svg" viewBox="0 0 400 400">

<g id="base" class="layer"></g>
<g id="features" class="layer"></g>
<g id="overlay" class="layer"></g>

</svg>

<div class="card">
<div id="type"></div>
<div id="details"></div>
</div>

</div>

<div class="right" id="content"></div>

</div>

<script>

/* STATE */

let data = {};
let flow = [];
let step = 0;

/* START */

start();

function start(){
set(`
<h1 style="color:#ebdaa8;">SPRZEDAŻ+</h1>

<div class="grid">
<div class="option" onclick="chooseType('mieszkanie')">Mieszkanie</div>
<div class="option" onclick="chooseType('dom')">Dom</div>
<div class="option" onclick="chooseType('lokal')">Lokal</div>
<div class="option" onclick="chooseType('hala')">Hala</div>
<div class="option" onclick="chooseType('dzialka')">Działka</div>
</div>
`);
}

/* FLOW */

function next(){
step++;
if(step < flow.length){
flow[step]();
}else{
set(`<h1>Gotowe</h1>`);
}
}

/* FLOWS */

const flows = {
mieszkanie:[roomsStep, balconyStep],
dom:[gardenStep],
lokal:[windowStep],
hala:[heightStep],
dzialka:[accessStep]
};

/* ===== STEPS ===== */

function roomsStep(){
set(`
<h1>Pokoje</h1>
<div class="grid">
${[1,2,3,4].map(n=>`<div class="option" onclick="setRooms(${n})">${n}</div>`).join("")}
</div>
`);
}

function balconyStep(){
set(`
<h1>Balkon</h1>
<div class="grid">
<div class="option" onclick="setBalcony(true)">Tak</div>
<div class="option" onclick="setBalcony(false)">Nie</div>
</div>
`);
}

function gardenStep(){
set(`
<h1>Ogród</h1>
<div class="grid">
<div class="option" onclick="setGarden(true)">Tak</div>
<div class="option" onclick="setGarden(false)">Nie</div>
</div>
`);
}

function windowStep(){
set(`
<h1>Witryna</h1>
<div class="grid">
<div class="option" onclick="setWindow(true)">Tak</div>
<div class="option" onclick="setWindow(false)">Nie</div>
</div>
`);
}

function heightStep(){
set(`
<h1>Wysokość</h1>
<div class="grid">
<div class="option" onclick="setHeight('low')">Niska</div>
<div class="option" onclick="setHeight('high')">Wysoka</div>
</div>
`);
}

function accessStep(){
set(`
<h1>Dojazd</h1>
<div class="grid">
<div class="option" onclick="setAccess(true)">Tak</div>
<div class="option" onclick="setAccess(false)">Nie</div>
</div>
`);
}

/* ===== SVG BASE ===== */

function drawBase(type){

const base = document.getElementById("base");
base.innerHTML = "";

if(type==="mieszkanie"){
base.innerHTML = `<rect x="100" y="120" width="200" height="200"/>`;
}

if(type==="dom"){
base.innerHTML = `<path d="M100 200 L200 120 L300 200 V300 H100 Z"/>`;
}

if(type==="lokal"){
base.innerHTML = `<rect x="120" y="180" width="160" height="120"/>`;
}

if(type==="hala"){
base.innerHTML = `<rect id="hall" x="100" y="220" width="200" height="80"/>`;
}

if(type==="dzialka"){
base.innerHTML = `<rect x="100" y="220" width="200" height="80"/>`;
}

clearLayers();
}

/* RESET */

function clearLayers(){
document.getElementById("features").innerHTML="";
document.getElementById("overlay").innerHTML="";
}

/* ===== ACTIONS ===== */

function chooseType(t){
data={};
data.type=t;

drawBase(t);

document.getElementById("type").innerText=t.toUpperCase();

flow = flows[t];
step=0;
flow[0]();
}

/* ===== REAKCJE ===== */

function setRooms(n){

const overlay = document.getElementById("overlay");
overlay.innerHTML="";

for(let i=1;i<n;i++){
let x = 100 + (i*(200/n));
overlay.innerHTML += `<line x1="${x}" y1="120" x2="${x}" y2="320"/>`;
}

next();
}

function setBalcony(v){

const features = document.getElementById("features");

if(v){
features.innerHTML += `<rect x="150" y="320" width="100" height="20"/>`;
}

next();
}

function setGarden(v){

const features = document.getElementById("features");

if(v){
features.innerHTML += `<rect x="80" y="320" width="240" height="40"/>`;
}

next();
}

function setWindow(v){

const features = document.getElementById("features");

if(v){
features.innerHTML += `<rect x="150" y="200" width="100" height="40"/>`;
}

next();
}

function setHeight(v){

const hall = document.getElementById("hall");

if(hall){
hall.setAttribute("height", v==="high"?140:80);
}

next();
}

function setAccess(v){

const features = document.getElementById("features");

if(v){
features.innerHTML += `<line x1="0" y1="300" x2="100" y2="260"/>`;
}

next();
}

/* UI */

function set(html){
document.getElementById("content").innerHTML=html;
}

</script>

</body>
</html>
