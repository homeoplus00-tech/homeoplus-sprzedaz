<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#0f1113;
color:white;
}

/* LAYOUT */

.container{
display:flex;
height:100vh;
}

.left{
width:50%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.right{
width:50%;
background:#0f1113;
padding:80px;
display:flex;
flex-direction:column;
justify-content:center;
}

/* MOBILE */

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:40%;width:100%;}
.right{height:60%;width:100%;padding:30px;}
}

/* TYPO */

h1{
font-size:38px;
font-weight:800;
margin-bottom:20px;
}

p{
opacity:0.6;
margin-bottom:30px;
}

/* OPTIONS */

.option{
border:1px solid rgba(255,255,255,0.2);
padding:14px 18px;
margin-top:10px;
cursor:pointer;
transition:0.25s;
}

.option:hover{
border-color:#ebdaa8;
color:#ebdaa8;
}

/* SVG */

svg{
width:280px;
margin-bottom:40px;
}

svg path, svg rect, svg line{
fill:none;
stroke:#ebdaa8;
stroke-width:2;
stroke-linecap:round;

stroke-dasharray:400;
stroke-dashoffset:400;
transition:0.6s;
}

.draw path, .draw rect, .draw line{
stroke-dashoffset:0;
}

/* STANY */

.problem *{
stroke:red !important;
stroke-dasharray:6;
}

.refresh *{
opacity:0.4;
}

/* KARTA */

.card{
color:#ebdaa8;
}

.card strong{
display:block;
font-weight:800;
margin-bottom:5px;
}

.card span{
opacity:0.7;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<!-- LEFT -->

<div class="left">

<svg id="svg" viewBox="0 0 400 400"></svg>

<div class="card">
<strong id="type"></strong>
<span id="details"></span>
</div>

</div>

<!-- RIGHT -->

<div class="right" id="content"></div>

</div>

<script>

/* ===== STATE ===== */

let data = {};
let flow = [];
let stepIndex = 0;

/* ===== START ===== */

start();

function start(){
set(`
<h1>Zajmujemy się sprzedażą Twojej nieruchomości</h1>
<p>Wybierz typ — przeprowadzimy Cię przez cały proces.</p>

<div class="option" onclick="chooseType('mieszkanie')">Mieszkanie</div>
<div class="option" onclick="chooseType('dom')">Dom</div>
<div class="option" onclick="chooseType('lokal')">Lokal usługowy</div>
<div class="option" onclick="chooseType('hala')">Magazyn / hala</div>
<div class="option" onclick="chooseType('dzialka')">Działka</div>
`);
}

/* ===== FLOW DEFINICJE ===== */

const flows = {

mieszkanie: [
stepRooms,
stepBalcony,
stepState
],

dom: [
stepRooms,
stepState
],

lokal: [
stepState
],

hala: [
stepState
],

dzialka: [
stepState
]

};

/* ===== FLOW CONTROL ===== */

function next(){
stepIndex++;

if(stepIndex < flow.length){
flow[stepIndex]();
}else{
analyze();
}
}

/* ===== STEPS ===== */

function stepRooms(){
set(`
<h1>Określamy układ nieruchomości</h1>
<p>Ile pomieszczeń ma Twoja nieruchomość?</p>

${[1,2,3,4,5].map(n=>`<div class="option" onclick="setRooms(${n})">${n===5?"5+":n}</div>`).join("")}
`);
}

function stepBalcony(){
set(`
<h1>Sprawdzamy potencjał przestrzeni</h1>
<p>Czy nieruchomość posiada balkon?</p>

<div class="option" onclick="setBalcony(true)">Tak</div>
<div class="option" onclick="setBalcony(false)">Nie</div>
`);
}

function stepState(){
set(`
<h1>Analizujemy stan nieruchomości</h1>

<div class="option" onclick="setState('ideal')">Gotowa do sprzedaży</div>
<div class="option" onclick="setState('refresh')">Wymaga odświeżenia</div>
<div class="option" onclick="setState('renovation')">Wymaga remontu</div>
<div class="option" onclick="setState('problem')">Problemy prawne / trudna</div>
`);
}

/* ===== SVG ===== */

function drawBase(type){

let svg=document.getElementById("svg");
svg.innerHTML="";
svg.className="";

if(type==="mieszkanie"){
svg.innerHTML=`<rect x="100" y="120" width="200" height="200"/>`;
}

if(type==="dom"){
svg.innerHTML=`<path d="M100 200 L200 120 L300 200 V300 H100 Z"/>`;
}

if(type==="lokal"){
svg.innerHTML=`<rect x="120" y="180" width="160" height="120"/>`;
}

if(type==="hala"){
svg.innerHTML=`<rect x="80" y="200" width="240" height="100"/>`;
}

if(type==="dzialka"){
svg.innerHTML=`<rect x="100" y="220" width="200" height="80"/>`;
}

animate();
}

/* ===== REAKCJE SVG ===== */

function drawRooms(n){

let svg=document.getElementById("svg");

svg.querySelectorAll(".room").forEach(e=>e.remove());

for(let i=1;i<n;i++){
let l=document.createElementNS("http://www.w3.org/2000/svg","line");
l.setAttribute("x1",100+(i*(200/n)));
l.setAttribute("y1",120);
l.setAttribute("x2",100+(i*(200/n)));
l.setAttribute("y2",320);
l.setAttribute("class","room");
svg.appendChild(l);
}

animate();
}

function drawBalcony(v){

let svg=document.getElementById("svg");

let old=svg.querySelector("#balcony");
if(old) old.remove();

if(v){
let b=document.createElementNS("http://www.w3.org/2000/svg","rect");
b.setAttribute("x",150);
b.setAttribute("y",320);
b.setAttribute("width",100);
b.setAttribute("height",20);
b.setAttribute("id","balcony");
svg.appendChild(b);
}

animate();
}

function applyState(s){

let svg=document.getElementById("svg");
svg.className="";

if(s==="problem") svg.classList.add("problem");
if(s==="refresh") svg.classList.add("refresh");
}

/* ===== ACTIONS ===== */

function chooseType(t){
data={};
data.type=t;

drawBase(t);

document.getElementById("type").innerText=t.toUpperCase();

flow = flows[t];
stepIndex = 0;

flow[0]();
}

function setRooms(n){
data.rooms=n;
drawRooms(n);
updateDetails();
next();
}

function setBalcony(v){
data.balcony=v;
drawBalcony(v);
next();
}

function setState(s){
data.state=s;
applyState(s);
next();
}

/* ===== UI ===== */

function set(html){
document.getElementById("content").innerHTML=html;
}

function updateDetails(){
if(data.rooms){
document.getElementById("details").innerText=
(data.rooms===1?"1 pokój":
data.rooms<=4?data.rooms+" pokoje":
data.rooms+" pokoi");
}
}

/* ===== ANIM ===== */

function animate(){
let svg=document.getElementById("svg");
svg.classList.remove("draw");
setTimeout(()=>svg.classList.add("draw"),50);
}

/* ===== ANALIZA ===== */

function analyze(){

set(`
<h1>${data.state==="problem"||data.state==="renovation"?"OD ZERA+":"SPRZEDAŻ+"}</h1>
<p>${data.state==="problem"?"Przejmujemy wszystko od podstaw":"Gotowe do sprzedaży — przechodzimy dalej."}</p>
`);

}

</script>

</body>
</html>
