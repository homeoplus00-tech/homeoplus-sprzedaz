<section class="homeo-experience">

<div class="progress-bar"></div>

<div class="experience-container">

  <!-- VISUAL (DOM) -->
  <div class="visual">
    <div class="house" id="house">
      <div class="roof"></div>
      <div class="body"></div>
      <div class="door"></div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="narration" id="narration">
      Zaczynamy proces sprzedaży.
    </div>

    <!-- STEP 1 -->
    <div class="step active">
      <h1>SPRZEDAŻ<span>+</span></h1>
      <p>To nie formularz. To system sprzedaży Twojej nieruchomości.</p>
      <button onclick="next()">Rozpocznij</button>
    </div>

    <!-- STEP 2 -->
    <div class="step">
      <h2>Co sprzedajesz?</h2>
      <div class="options">
        <div onclick="selectType('Mieszkanie')">Mieszkanie</div>
        <div onclick="selectType('Dom')">Dom</div>
        <div onclick="selectType('Działka')">Działka</div>
        <div onclick="selectType('Lokal')">Lokal</div>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="step">
      <h2>Stan nieruchomości</h2>
      <div class="options">
        <div onclick="selectState('clean')">Gotowa</div>
        <div onclick="selectState('medium')">Do poprawy</div>
        <div onclick="selectState('problem')">Problemy</div>
      </div>
    </div>

    <!-- STEP OD ZERA -->
    <div class="step" id="zero">
      <h2>OD ZERA<span>+</span></h2>
      <p>Przejmujemy wszystko: prawo, remont, przygotowanie.</p>
      <button onclick="next()">Przejdź dalej</button>
    </div>

    <!-- STEP 4 -->
    <div class="step">
      <h2>Metraż</h2>
      <input type="number" id="area" placeholder="np. 65">
      <button onclick="next()">Dalej</button>
    </div>

    <!-- STEP 5 -->
    <div class="step">
      <h2>Lokalizacja</h2>
      <input type="text" id="city" placeholder="Miasto">
      <button onclick="next()">Dalej</button>
    </div>

    <!-- STEP FINAL -->
    <div class="step">
      <h2>Gotowe</h2>
      <p id="summary"></p>
      <button onclick="submit()">Wyślij</button>
    </div>

  </div>
</div>

<style>
.homeo-experience{
  height:100vh;
  display:flex;
  background:#1B1C1E;
  color:#fff;
  font-family:'Montserrat',sans-serif;
}

.progress-bar{
  position:fixed;
  top:0;
  left:0;
  height:3px;
  width:0%;
  background:#ebdaa8;
  transition:0.4s;
}

.experience-container{
  display:flex;
  width:100%;
}

/* LEFT VISUAL */
.visual{
  width:50%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.house{
  width:120px;
  height:120px;
  position:relative;
  opacity:0.2;
  transition:0.6s;
}

.house.active{
  opacity:1;
  transform:scale(1.1);
}

.roof{
  width:0;
  height:0;
  border-left:60px solid transparent;
  border-right:60px solid transparent;
  border-bottom:50px solid #ebdaa8;
}

.body{
  width:120px;
  height:80px;
  background:#ebdaa8;
}

.door{
  width:25px;
  height:40px;
  background:#1B1C1E;
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
}

/* RIGHT CONTENT */
.content{
  width:50%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.narration{
  position:absolute;
  top:40px;
  opacity:0.5;
}

.step{display:none;text-align:center;}
.step.active{display:block;animation:fade 0.5s;}

.options div{
  border:1px solid #ebdaa8;
  padding:15px;
  margin:10px;
  cursor:pointer;
  transition:0.3s;
}

.options div:hover{
  background:#ebdaa8;
  color:#000;
}

input{
  padding:12px;
  margin:20px;
  border:none;
  border-bottom:1px solid #fff;
  background:transparent;
  color:#fff;
}

button{
  padding:12px 25px;
  border:1px solid #ebdaa8;
  background:none;
  color:#ebdaa8;
  cursor:pointer;
}

button:hover{
  background:#ebdaa8;
  color:#000;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;}
}
</style>

<script>
let step = 0;
let type = "";
let state = "";

const steps = document.querySelectorAll(".step");
const narration = document.getElementById("narration");
const house = document.getElementById("house");
const progress = document.querySelector(".progress-bar");

function update(){
  steps.forEach(s=>s.classList.remove("active"));
  steps[step].classList.add("active");

  progress.style.width = ((step)/(steps.length-1))*100+"%";

  house.classList.add("active");

  // NARRACJA
  if(step===1) narration.innerText="Określamy typ nieruchomości";
  if(step===2) narration.innerText="Analizujemy stan";
  if(step===3) narration.innerText="Dostosowujemy strategię";
  if(step===4) narration.innerText="Precyzujemy szczegóły";
  if(step===5) narration.innerText="Finalizujemy proces";
}

function next(){
  step++;
  update();
}

function selectType(t){
  type=t;
  next();
}

function selectState(s){
  state=s;

  if(state==="problem"){
    step=3; // OD ZERA
  } else {
    step++;
  }
  update();
}

function submit(){
  document.getElementById("summary").innerText =
    `Sprzedajesz ${type} w ${city.value}, ${area.value}m²`;

  alert("Wysłano");
}

update();
</script>

</section>
