<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body {
    margin:0;
    font-family:Montserrat;
    background:#1B1C1E;
}

.container {
    display:flex;
    height:100vh;
}

.left, .right {
    width:50%;
}

.left {
    display:flex;
    align-items:center;
    justify-content:center;
}

.right {
    background:white;
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

@media(max-width:900px){
    .container{flex-direction:column;}
    .left{height:40%;width:100%;}
    .right{height:60%;width:100%;padding:30px;}
}

h1{font-size:38px;font-weight:800;}
.option{
    border:1px solid #ddd;
    padding:15px;
    margin-top:10px;
    cursor:pointer;
}

.button{
    margin-top:20px;
    padding:14px;
    background:#ebdaa8;
    border:none;
    cursor:pointer;
}

.input{
    margin-top:15px;
    padding:12px;
    width:100%;
    border:none;
    border-bottom:1px solid #ccc;
}

/* SVG */

svg{
    width:300px;
}

svg path, svg rect, svg line{
    fill:none;
    stroke:#ebdaa8;
    stroke-width:2;

    stroke-dasharray:400;
    stroke-dashoffset:400;
    transition:0.8s;
}

.draw path, .draw rect, .draw line{
    stroke-dashoffset:0;
}

.info{
    color:#ebdaa8;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="left">
<svg id="svg" viewBox="0 0 400 400"></svg>

<div class="info">
<div id="type"></div>
<div id="extra"></div>
</div>
</div>

<div class="right" id="content">
<h1>SPRZEDAŻ+</h1>
<button class="button" onclick="start()">Start</button>
</div>

</div>

<script>

let step=0;
let data={};

/* FLOW */

function start(){next();}

function next(){
step++;
let c=document.getElementById("content");

/* WYBÓR TYPU */

if(step===1){
c.innerHTML=`
<h1>Typ nieruchomości</h1>

<div class="option" onclick="choose('apartment')">Mieszkanie</div>
<div class="option" onclick="choose('house')">Dom</div>
<div class="option" onclick="choose('commercial')">Lokal usługowy</div>
<div class="option" onclick="choose('industrial')">Magazyn / hala</div>
<div class="option" onclick="choose('land')">Działka</div>
`;
}

/* METRAŻ */

if(step===2){
c.innerHTML=`
<h1>Metraż</h1>
<input id="size" class="input">
<button class="button" onclick="saveSize()">Dalej</button>
`;
}

/* POKOJE tylko dla mieszkalnych */

if(step===3 && (data.type==="apartment" || data.type==="house")){
c.innerHTML=`
<h1>Liczba pokoi</h1>
<input id="rooms" class="input">
<button class="button" onclick="saveRooms()">Dalej</button>
`;
}

/* STAN (KLUCZ) */

if(step===4){
c.innerHTML=`
<h1>Stan nieruchomości</h1>

<div class="option" onclick="setState('ideal')">Gotowa</div>
<div class="option" onclick="setState('refresh')">Do odświeżenia</div>
<div class="option" onclick="setState('renovation')">Do remontu</div>
<div class="option" onclick="setState('problem')">Problemy prawne / trudna</div>
`;
}

/* KONIEC */

if(step===5){
c.innerHTML=`<h1>Analiza...</h1>`;
analyze();
}

}

/* SVG RYSUNKI */

function draw(type){

let svg=document.getElementById("svg");

svg.innerHTML="";

if(type==="house"){
svg.innerHTML=`<path d="M100 200 L200 120 L300 200 V300 H100 Z"/>`;
}

if(type==="apartment"){
svg.innerHTML=`
<rect x="120" y="120" width="160" height="200"/>
<line x1="120" y1="180" x2="280" y2="180"/>
<line x1="120" y1="240" x2="280" y2="240"/>
`;
}

if(type==="commercial"){
svg.innerHTML=`
<rect x="120" y="150" width="160" height="150"/>
<rect x="150" y="200" width="100" height="50"/>
`;
}

if(type==="industrial"){
svg.innerHTML=`
<rect x="80" y="180" width="240" height="120"/>
<line x1="80" y1="180" x2="200" y2="120"/>
<line x1="320" y1="180" x2="200" y2="120"/>
`;
}

if(type==="land"){
svg.innerHTML=`<rect x="100" y="200" width="200" height="100"/>`;
}

svg.classList.remove("draw");
setTimeout(()=>svg.classList.add("draw"),50);

}

/* ACTIONS */

function choose(type){
data.type=type;
draw(type);
document.getElementById("type").innerText=type.toUpperCase()+"+";
next();
}

function saveSize(){
data.size=document.getElementById("size").value;
next();
}

function saveRooms(){
data.rooms=document.getElementById("rooms").value;
document.getElementById("extra").innerText=data.rooms+" pokoi";
next();
}

function setState(s){
data.state=s;
next();
}

/* LOGIKA OD ZERA+ */

function analyze(){

let c=document.getElementById("content");

if(data.state==="problem" || data.state==="renovation"){
c.innerHTML=`
<h1>OD ZERA+</h1>
<p>Twoja nieruchomość wymaga pełnego procesu.</p>
`;
}
else{
c.innerHTML=`
<h1>SPRZEDAŻ+</h1>
<p>Gotowe do sprzedaży.</p>
`;
}

}

</script>

</body>
</html>
