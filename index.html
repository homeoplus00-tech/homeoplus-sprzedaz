<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#1B1C1E;
}

.container{
display:flex;
height:100vh;
}

.left{
width:50%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.right{
width:50%;
background:white;
padding:80px;
display:flex;
flex-direction:column;
justify-content:center;
}

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:40%;width:100%;}
.right{height:60%;width:100%;padding:30px;}
}

h1{font-size:42px;font-weight:800;}
.option{
border:1px solid #ddd;
padding:14px;
margin-top:10px;
cursor:pointer;
}

.button{
margin-top:20px;
padding:14px;
background:#ebdaa8;
border:none;
cursor:pointer;
}

/* SVG */

svg{
width:280px;
margin-bottom:40px;
}

svg path, svg rect, svg line{
fill:none;
stroke:#ebdaa8;
stroke-width:2;

stroke-dasharray:400;
stroke-dashoffset:400;
transition:0.8s;
}

.draw path, .draw rect, .draw line{
stroke-dashoffset:0;
}

/* KARTA */

.card{
color:#ebdaa8;
text-align:left;
}

.card strong{
font-weight:800;
display:block;
margin-bottom:5px;
}

.card span{
opacity:0.8;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<div class="left">

<svg id="svg" viewBox="0 0 400 400"></svg>

<div class="card">
<strong id="type"></strong>
<span id="details"></span>
</div>

</div>

<div class="right" id="content">
<h1>SPRZEDAŻ+</h1>
<button class="button" onclick="start()">Start</button>
</div>

</div>

<script>

let step=0;
let data={};

/* FLOW */

function start(){next();}

function next(){
step++;
let c=document.getElementById("content");

/* TYP */

if(step===1){
c.innerHTML=`
<h1>Typ nieruchomości</h1>

<div class="option" onclick="choose('mieszkanie')">Mieszkanie</div>
<div class="option" onclick="choose('dom')">Dom</div>
<div class="option" onclick="choose('lokal')">Lokal usługowy</div>
<div class="option" onclick="choose('hala')">Magazyn / hala</div>
<div class="option" onclick="choose('dzialka')">Działka</div>
`;
}

/* POKOJE */

if(step===2 && (data.type==="mieszkanie"||data.type==="dom")){
c.innerHTML=`
<h1>Liczba pokoi</h1>

<div class="option" onclick="setRooms(1)">1</div>
<div class="option" onclick="setRooms(2)">2</div>
<div class="option" onclick="setRooms(3)">3</div>
<div class="option" onclick="setRooms(4)">4</div>
<div class="option" onclick="setRooms(5)">5+</div>
`;
}

/* BALKON */

if(step===3 && data.type==="mieszkanie"){
c.innerHTML=`
<h1>Balkon</h1>

<div class="option" onclick="setBalcony(true)">Tak</div>
<div class="option" onclick="setBalcony(false)">Nie</div>
`;
}

/* STAN */

if(step===4){
c.innerHTML=`
<h1>Stan nieruchomości</h1>

<div class="option" onclick="setState('ideal')">Gotowa</div>
<div class="option" onclick="setState('refresh')">Do odświeżenia</div>
<div class="option" onclick="setState('renovation')">Do remontu</div>
<div class="option" onclick="setState('problem')">Problemy prawne</div>
`;
}

/* KONIEC */

if(step===5){
analyze();
}

}

/* SVG */

function draw(type){

let svg=document.getElementById("svg");
svg.innerHTML="";

/* DOM */

if(type==="dom"){
svg.innerHTML=`
<path d="M100 200 L200 120 L300 200 V300 H100 Z"/>
`;
}

/* BLOK */

if(type==="mieszkanie"){
svg.innerHTML=`
<rect x="140" y="120" width="120" height="200"/>
<line x1="140" y1="180" x2="260" y2="180"/>
<line x1="140" y1="240" x2="260" y2="240"/>
`;
}

/* LOKAL */

if(type==="lokal"){
svg.innerHTML=`
<rect x="120" y="180" width="160" height="120"/>
<rect x="150" y="210" width="100" height="60"/>
`;
}

/* HALA */

if(type==="hala"){
svg.innerHTML=`
<rect x="80" y="200" width="240" height="100"/>
<line x1="80" y1="200" x2="200" y2="140"/>
<line x1="320" y1="200" x2="200" y2="140"/>
`;
}

/* DZIAŁKA */

if(type==="dzialka"){
svg.innerHTML=`<rect x="100" y="220" width="200" height="80"/>`;
}

svg.classList.remove("draw");
setTimeout(()=>svg.classList.add("draw"),50);

}

/* DYNAMICZNE */

function updateRooms(n){

let svg=document.getElementById("svg");

/* usuwamy stare */
svg.querySelectorAll(".room").forEach(e=>e.remove());

for(let i=0;i<n;i++){
let r=document.createElementNS("http://www.w3.org/2000/svg","rect");

r.setAttribute("x",150+(i*30));
r.setAttribute("y",260);
r.setAttribute("width",20);
r.setAttribute("height",20);
r.setAttribute("class","room");

svg.appendChild(r);
}

svg.classList.remove("draw");
setTimeout(()=>svg.classList.add("draw"),50);

}

/* BALKON */

function updateBalcony(show){

let svg=document.getElementById("svg");

let old=svg.querySelector("#balcony");
if(old) old.remove();

if(show){
let b=document.createElementNS("http://www.w3.org/2000/svg","rect");
b.setAttribute("x",160);
b.setAttribute("y",320);
b.setAttribute("width",80);
b.setAttribute("height",20);
b.setAttribute("id","balcony");

svg.appendChild(b);
}

svg.classList.remove("draw");
setTimeout(()=>svg.classList.add("draw"),50);

}

/* TEKST */

function roomsText(n){
if(n===1) return "1 pokój";
if(n>=2 && n<=4) return n+" pokoje";
return n+" pokoi";
}

/* ACTIONS */

function choose(type){
data.type=type;

draw(type);

document.getElementById("type").innerText=type.toUpperCase();

next();
}

function setRooms(n){
data.rooms=n;

updateRooms(n);

document.getElementById("details").innerText=roomsText(n);

next();
}

function setBalcony(v){
data.balcony=v;

updateBalcony(v);

next();
}

function setState(s){
data.state=s;
next();
}

/* LOGIKA */

function analyze(){

let c=document.getElementById("content");

if(data.state==="problem" || data.state==="renovation"){
c.innerHTML=`
<h1>OD ZERA+</h1>
<p>Przejmujemy proces od podstaw.</p>
`;
}else{
c.innerHTML=`
<h1>SPRZEDAŻ+</h1>
<p>Gotowe do sprzedaży.</p>
`;
}

}

</script>

</body>
</html>
