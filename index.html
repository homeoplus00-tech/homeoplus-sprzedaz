<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMEO+</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Montserrat;
background:#1B1C1E;
}

.container{
display:flex;
height:100vh;
}

.left{
width:50%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.right{
width:50%;
background:white;
padding:80px;
display:flex;
flex-direction:column;
justify-content:center;
}

@media(max-width:900px){
.container{flex-direction:column;}
.left{height:40%;width:100%;}
.right{height:60%;width:100%;padding:30px;}
}

h1{font-size:42px;font-weight:800;}

.option{
border:1px solid #ddd;
padding:14px;
margin-top:10px;
cursor:pointer;
}

.option:active{
transform:scale(0.98);
}

.button{
margin-top:20px;
padding:14px;
background:#ebdaa8;
border:none;
cursor:pointer;
}

/* SVG */

svg{
width:300px;
margin-bottom:40px;
}

svg path, svg rect, svg line{
fill:none;
stroke:#ebdaa8;
stroke-width:2;
stroke-linecap:round;

stroke-dasharray:400;
stroke-dashoffset:400;
transition:0.8s;
}

.draw path, .draw rect, .draw line{
stroke-dashoffset:0;
}

/* STAN */

.problem path, .problem rect, .problem line{
stroke-dasharray:6;
}

.refresh path{
opacity:0.5;
}

/* KARTA */

.card{
color:#ebdaa8;
}

.card strong{
font-weight:800;
display:block;
margin-bottom:5px;
}

.card span{
opacity:0.8;
}

</style>
</head>

<body>

<div class="container">

<div class="left">

<svg id="svg" viewBox="0 0 400 400"></svg>

<div class="card">
<strong id="type"></strong>
<span id="details"></span>
</div>

</div>

<div class="right" id="content">
<h1>SPRZEDAŻ+</h1>
<button class="button" onclick="start()">Start</button>
</div>

</div>

<script>

let data={};

/* FLOW CONTROL */

function start(){
stepType();
}

/* ================= KROKI ================= */

function stepType(){
setContent(`
<h1>Typ nieruchomości</h1>

<div class="option" onclick="chooseType('mieszkanie')">Mieszkanie</div>
<div class="option" onclick="chooseType('dom')">Dom</div>
<div class="option" onclick="chooseType('lokal')">Lokal usługowy</div>
<div class="option" onclick="chooseType('hala')">Magazyn / hala</div>
<div class="option" onclick="chooseType('dzialka')">Działka</div>
`);
}

function stepRooms(){
setContent(`
<h1>Liczba pokoi</h1>

<div class="option" onclick="chooseRooms(1)">1</div>
<div class="option" onclick="chooseRooms(2)">2</div>
<div class="option" onclick="chooseRooms(3)">3</div>
<div class="option" onclick="chooseRooms(4)">4</div>
<div class="option" onclick="chooseRooms(5)">5+</div>
`);
}

function stepBalcony(){
setContent(`
<h1>Balkon</h1>

<div class="option" onclick="chooseBalcony(true)">Tak</div>
<div class="option" onclick="chooseBalcony(false)">Nie</div>
`);
}

function stepState(){
setContent(`
<h1>Stan nieruchomości</h1>

<div class="option" onclick="chooseState('ideal')">Gotowa</div>
<div class="option" onclick="chooseState('refresh')">Do odświeżenia</div>
<div class="option" onclick="chooseState('renovation')">Do remontu</div>
<div class="option" onclick="chooseState('problem')">Problemy</div>
`);
}

/* ================= SVG ================= */

function drawBase(type){

let svg=document.getElementById("svg");
svg.className="";

if(type==="mieszkanie"){
svg.innerHTML=`<rect x="100" y="120" width="200" height="200"/>`;
}

if(type==="dom"){
svg.innerHTML=`<path d="M100 200 L200 120 L300 200 V300 H100 Z"/>`;
}

if(type==="lokal"){
svg.innerHTML=`<rect x="120" y="180" width="160" height="120"/>`;
}

if(type==="hala"){
svg.innerHTML=`<rect x="80" y="200" width="240" height="100"/>`;
}

if(type==="dzialka"){
svg.innerHTML=`<rect x="100" y="220" width="200" height="80"/>`;
}

animate();
}

/* PLAN MIESZKANIA */

function drawRooms(n){

if(data.type!=="mieszkanie") return;

let svg=document.getElementById("svg");

/* usuwamy stare */
svg.querySelectorAll(".room").forEach(e=>e.remove());

/* podział przestrzeni */

if(n===2){
addLine(200,120,200,320);
}

if(n===3){
addLine(200,120,200,320);
addLine(100,220,200,220);
}

if(n===4){
addLine(200,120,200,320);
addLine(100,220,300,220);
}

if(n>=5){
addLine(200,120,200,320);
addLine(100,220,300,220);
addLine(150,120,150,320);
}

animate();
}

function addLine(x1,y1,x2,y2){
let l=document.createElementNS("http://www.w3.org/2000/svg","line");
l.setAttribute("x1",x1);
l.setAttribute("y1",y1);
l.setAttribute("x2",x2);
l.setAttribute("y2",y2);
l.setAttribute("class","room");
document.getElementById("svg").appendChild(l);
}

/* BALKON */

function drawBalcony(show){

let svg=document.getElementById("svg");

let old=svg.querySelector("#balcony");
if(old) old.remove();

if(show){
let b=document.createElementNS("http://www.w3.org/2000/svg","rect");
b.setAttribute("x",150);
b.setAttribute("y",320);
b.setAttribute("width",100);
b.setAttribute("height",20);
b.setAttribute("id","balcony");
svg.appendChild(b);
}

animate();
}

/* STAN */

function applyState(state){

let svg=document.getElementById("svg");
svg.className="";

if(state==="problem") svg.classList.add("problem");
if(state==="refresh") svg.classList.add("refresh");

}

/* ================= ACTIONS ================= */

function chooseType(t){
data.type=t;
drawBase(t);

document.getElementById("type").innerText=t;

if(t==="mieszkanie"||t==="dom") stepRooms();
else stepState();
}

function chooseRooms(n){
data.rooms=n;

drawRooms(n);

document.getElementById("details").innerText=roomsText(n);

if(data.type==="mieszkanie") stepBalcony();
else stepState();
}

function chooseBalcony(v){
data.balcony=v;
drawBalcony(v);
stepState();
}

function chooseState(s){
data.state=s;
applyState(s);
analyze();
}

/* ================= TEKST ================= */

function roomsText(n){
if(n===1) return "1 pokój";
if(n>=2 && n<=4) return n+" pokoje";
return n+" pokoi";
}

/* ================= UI ================= */

function setContent(html){
document.getElementById("content").innerHTML=html;
}

/* ================= ANIM ================= */

function animate(){
let svg=document.getElementById("svg");
svg.classList.remove("draw");
setTimeout(()=>svg.classList.add("draw"),50);
}

/* ================= LOGIKA ================= */

function analyze(){

let c=document.getElementById("content");

if(data.state==="problem"||data.state==="renovation"){
c.innerHTML=`<h1>OD ZERA+</h1><p>Przejmujemy proces od podstaw.</p>`;
}
else{
c.innerHTML=`<h1>SPRZEDAŻ+</h1><p>Gotowe do sprzedaży.</p>`;
}

}

</script>

</body>
</html>
